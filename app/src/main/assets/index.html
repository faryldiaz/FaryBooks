<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#c13f69'><title>FaryBooks</title><link rel='manifest' href='manifest.json'><style>
:root{--rose:#bd3f68;--pink:#f6dce5;--cream:#fff9f6;--ink:#2d2027;--muted:#8b747e;--card:#fff;--lav:#eee5fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7f4,#f7edf8);font-family:Georgia,serif;color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:rgba(255,255,255,.68);box-shadow:0 0 40px #b98aa522}.head{padding:28px 22px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:32px}.round,.primary{border:0;cursor:pointer}.round{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;font-size:25px}.tabs{display:flex;gap:8px;padding:8px 22px 18px;overflow:auto}.pill{padding:9px 14px;border-radius:20px;background:#fff;border:1px solid #eadce1;white-space:nowrap}.pill.active{background:var(--rose);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:0 22px 100px}.book{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #7c4d6414;cursor:pointer}.cover{aspect-ratio:3/4;background:linear-gradient(145deg,#472348,#b64b7b 55%,#f0a9b9);display:flex;align-items:end;padding:18px;color:#fff;font-size:22px;text-shadow:0 2px 8px #0008}.meta{padding:13px}.meta small{color:var(--muted)}.new{aspect-ratio:3/4;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f7e6ed);border:1px dashed #d8a6b7}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:flex;justify-content:space-around;padding:14px;background:#fffdfbcc;border-top:1px solid #eadce1;backdrop-filter:blur(12px)}.bottom span{font-size:13px}.view{display:none}.view.active{display:block}.back{background:none;border:0;font-size:27px;cursor:pointer}.hero{margin:0 22px;border-radius:24px;min-height:240px;padding:25px;display:flex;align-items:end;background:linear-gradient(145deg,#4d274f,#c44c78,#f3b6c7);color:#fff}.hero h1{font-size:34px;margin:0}.section{margin:18px 22px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 8px 24px #7c4d6410}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{padding:14px;border-radius:15px;background:var(--rose);color:white}.chapter{padding:16px;border-bottom:1px solid #f0e3e8;cursor:pointer}.chapter:last-child{border:0}.editor{padding:0 22px 100px}.title{width:100%;border:0;background:transparent;font-size:27px;padding:10px 0;outline:none}.text{width:100%;min-height:55vh;border:0;background:#fff;border-radius:20px;padding:20px;line-height:1.7;font-size:18px;outline:none;resize:vertical}.status{color:var(--muted);padding:10px 4px;font-size:14px}.modal{position:fixed;inset:0;background:#33202a77;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.box{background:#fff;width:min(460px,100%);padding:24px;border-radius:24px}.box input,.box textarea{width:100%;padding:12px;border:1px solid #eadce1;border-radius:12px;margin:7px 0}.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
</style></head><body><main class='app'>
<section id='library' class='view active'><div class='head'><div class='brand'>FaryBooks</div><button class='round' onclick='openNew()'>+</button></div><div class='tabs'><div class='pill active'>Todas</div><div class='pill'>En progreso</div><div class='pill'>Completadas</div></div><div id='books' class='grid'></div></section>
<section id='novel' class='view'><div class='head'><button class='back' onclick="show('library')">‹</button><b>Mi novela</b><span></span></div><div id='hero' class='hero'><h1 id='novelTitle'></h1></div><div class='section'><h3>Sinopsis</h3><p id='synopsis'></p></div><div class='section actions'><button class='primary' onclick='renderChapters()'>Capítulos</button><button class='primary' onclick='renderCharacters()'>Personajes</button></div><div class='section' id='chapters'></div><div class='section' id='characters' style='display:none'></div></section>
<section id='editor' class='view'><div class='head'><button class='back' onclick="show('novel')">‹</button><b>Editor</b><span>☁︎</span></div><div class='editor'><input id='chapterTitle' class='title' placeholder='Título del capítulo'><textarea id='chapterText' class='text' placeholder='Empieza a escribir tu historia...'></textarea><div id='status' class='status'>Guardado automáticamente · 0 palabras</div></div></section>
<nav class='bottom'><span>📚 Biblioteca</span><span>📝 Notas</span><span>💡 Ideas</span><span>⚙️ Ajustes</span></nav></main>
<div id='modal' class='modal'><div class='box'><h2>Nueva novela</h2><input id='newTitle' placeholder='Título'><textarea id='newSynopsis' placeholder='Sinopsis'></textarea><div class='row'><button class='pill' onclick='closeNew()'>Cancelar</button><button class='primary' onclick='createNovel()'>Crear novela</button></div></div></div>
<script>
const KEY='farybooks-v01';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{books:[{id:1,title:'Reclamada por el Rey Lycan',synopsis:'Una historia de secretos, poder y destino.',chapters:[{title:'El inicio de todo',text:''}]}]};let currentBook=1,currentChapter=0;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='library')renderBooks()}function renderBooks(){let el=document.getElementById('books');el.innerHTML=data.books.map(b=>`<article class="book" onclick="openBook(${b.id})"><div class="cover">${b.title}</div><div class="meta"><b>${b.title}</b><br><small>${b.chapters.length} capítulos</small></div></article>`).join('')+`<article class="book new" onclick="openNew()"><div><div style="font-size:42px;text-align:center">＋</div>Nueva novela</div></article>`}function openNew(){modal.classList.add('show')}function closeNew(){modal.classList.remove('show')}function createNovel(){let t=newTitle.value.trim();if(!t)return;let id=Date.now();data.books.push({id,title:t,synopsis:newSynopsis.value.trim()||'Sin sinopsis todavía.',chapters:[]});save();newTitle.value='';newSynopsis.value='';closeNew();renderBooks()}function openBook(id){currentBook=id;let b=data.books.find(x=>x.id===id);novelTitle.textContent=b.title;synopsis.textContent=b.synopsis;chapters.innerHTML='';show('novel')}function renderChapters(){characters.style.display='none';chapters.style.display='block';let b=data.books.find(x=>x.id===currentBook);chapters.innerHTML='<h3>Capítulos</h3>'+b.chapters.map((c,i)=>`<div class="chapter" onclick="openChapter(${i})"><b>${i+1}. ${c.title||'Sin título'}</b><br><small>${words(c.text)} palabras</small></div>`).join('')+`<button class="primary" style="width:100%;margin-top:14px" onclick="addChapter()">+ Nuevo capítulo</button>`}function renderCharacters(){chapters.style.display='none';characters.style.display='block';let b=data.books.find(x=>x.id===currentBook);b.characters=b.characters||[];characters.innerHTML='<h3>Personajes</h3>'+b.characters.map((p,i)=>`<div class="chapter"><b>${p.name}</b><br><small>${p.role||'Sin rol'} · ${p.notes||'Sin notas'}</small><div style="margin-top:8px"><button class="pill" onclick="editCharacter(${i})">Editar</button> <button class="pill" onclick="deleteCharacter(${i})">Eliminar</button></div></div>`).join('')+`<button class="primary" style="width:100%;margin-top:14px" onclick="addCharacter()">+ Nuevo personaje</button>`;save()}function addCharacter(){let name=prompt('Nombre del personaje');if(!name)return;let role=prompt('Rol (protagonista, antagonista, secundario...)')||'';let notes=prompt('Descripción o notas')||'';let b=data.books.find(x=>x.id===currentBook);b.characters=b.characters||[];b.characters.push({name,role,notes});save();renderCharacters()}function editCharacter(i){let b=data.books.find(x=>x.id===currentBook),p=b.characters[i];let name=prompt('Nombre',p.name);if(name===null)return;p.name=name.trim()||p.name;let role=prompt('Rol',p.role||'');if(role!==null)p.role=role;let notes=prompt('Descripción o notas',p.notes||'');if(notes!==null)p.notes=notes;save();renderCharacters()}function deleteCharacter(i){if(!confirm('¿Eliminar este personaje?'))return;let b=data.books.find(x=>x.id===currentBook);b.characters.splice(i,1);save();renderCharacters()}function addChapter(){let b=data.books.find(x=>x.id===currentBook);b.chapters.push({title:'Nuevo capítulo',text:''});save();renderChapters()}function openChapter(i){currentChapter=i;let c=data.books.find(x=>x.id===currentBook).chapters[i];chapterTitle.value=c.title;chapterText.value=c.text;updateStatus();show('editor')}function words(s){return (s.trim().match(/\S+/g)||[]).length}function updateStatus(){status.textContent=`Guardado automáticamente · ${words(chapterText.value)} palabras`}function editSave(){let c=data.books.find(x=>x.id===currentBook).chapters[currentChapter];c.title=chapterTitle.value;c.text=chapterText.value;save();updateStatus()}chapterTitle.addEventListener('input',editSave);chapterText.addEventListener('input',editSave);renderBooks();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
