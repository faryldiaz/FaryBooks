<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#c13f69'><title>FaryBooks</title><link rel='manifest' href='manifest.json'><style>
:root{--rose:#bd3f68;--pink:#f6dce5;--cream:#fff9f6;--ink:#2d2027;--muted:#8b747e;--card:#fff;--lav:#eee5fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7f4,#f7edf8);font-family:Georgia,serif;color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:rgba(255,255,255,.68);box-shadow:0 0 40px #b98aa522}.head{padding:28px 22px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:32px}.round,.primary{border:0;cursor:pointer}.round{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;font-size:25px}.tabs{display:flex;gap:8px;padding:8px 22px 18px;overflow:auto}.pill{padding:9px 14px;border-radius:20px;background:#fff;border:1px solid #eadce1;white-space:nowrap}.pill.active{background:var(--rose);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:0 22px 100px}.book{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #7c4d6414;cursor:pointer}.cover{aspect-ratio:3/4;background:linear-gradient(145deg,#472348,#b64b7b 55%,#f0a9b9);display:flex;align-items:end;padding:18px;color:#fff;font-size:22px;text-shadow:0 2px 8px #0008}.meta{padding:13px}.meta small{color:var(--muted)}.new{aspect-ratio:3/4;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f7e6ed);border:1px dashed #d8a6b7}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:flex;justify-content:space-around;padding:14px;background:#fffdfbcc;border-top:1px solid #eadce1;backdrop-filter:blur(12px)}.bottom span{font-size:13px}.view{display:none}.view.active{display:block}.back{background:none;border:0;font-size:27px;cursor:pointer}.hero{margin:0 22px;border-radius:24px;min-height:240px;padding:25px;display:flex;align-items:end;background:linear-gradient(145deg,#4d274f,#c44c78,#f3b6c7);color:#fff}.hero h1{font-size:34px;margin:0}.section{margin:18px 22px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 8px 24px #7c4d6410}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{padding:14px;border-radius:15px;background:var(--rose);color:white}.chapter{padding:16px;border-bottom:1px solid #f0e3e8;cursor:pointer}.chapter:last-child{border:0}.editor{padding:0 22px 100px}.title{width:100%;border:0;background:transparent;font-size:27px;padding:10px 0;outline:none}.text{width:100%;min-height:55vh;border:0;background:#fff;border-radius:20px;padding:20px;line-height:1.7;font-size:18px;outline:none;resize:vertical}.status{color:var(--muted);padding:10px 4px;font-size:14px}.modal{position:fixed;inset:0;background:#33202a77;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.box{background:#fff;width:min(460px,100%);padding:24px;border-radius:24px}.box input,.box textarea{width:100%;padding:12px;border:1px solid #eadce1;border-radius:12px;margin:7px 0}.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
.topbar{padding:18px 22px 8px;display:flex;align-items:center;gap:16px}.topbar .brand{flex:1;text-align:center;font-size:30px}.wideNew{margin:8px 22px 18px;width:calc(100% - 44px);font-size:17px}.cover{position:relative}.cover:after{content:'⋮';position:absolute;right:12px;top:10px;font-size:25px}.progress{height:4px;background:#eadde2;border-radius:5px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--rose);width:25%}.hero{position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:22px;top:18px;font-size:28px;opacity:.6}.infoTabs{display:flex;gap:7px;margin:14px 22px 0;overflow:auto}.infoTabs button{border:0;background:#f7edf1;padding:10px 14px;border-radius:18px;white-space:nowrap}.infoTabs button:first-child{background:var(--rose);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 22px 14px}.stat{background:white;border-radius:16px;padding:12px 5px;text-align:center;box-shadow:0 5px 16px #7c4d6410}.stat b{display:block;font-size:18px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 22px 100px}.tool{background:white;border:1px solid #f0e1e6;border-radius:15px;padding:14px;text-align:left;cursor:pointer}.chapter{display:flex;justify-content:space-between;align-items:center;gap:10px}.chapter small{color:var(--muted)}.chapterNum{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#f4cad8;margin-right:10px}.editorbar{display:flex;gap:8px;overflow:auto;padding:10px 0}.editorbar button{border:1px solid #eadce1;background:white;border-radius:10px;padding:8px 10px}.bottom span{cursor:pointer}
body{padding-top:env(safe-area-inset-top);background:linear-gradient(180deg,#fffaf8 0%,#fff 45%,#fdf8fb 100%)}
.app{padding-top:10px;background:linear-gradient(180deg,rgba(255,250,248,.96),rgba(255,255,255,.98));overflow:hidden}
.topbar{min-height:76px;padding:24px 26px 12px}.topbar .brand{font-size:28px;line-height:1.1}.topbar>span{width:36px;text-align:center}
.tabs{padding:10px 24px 12px;gap:7px}.pill{padding:9px 13px;font-size:15px}
.wideNew{margin:8px 24px 20px;width:calc(100% - 48px);box-shadow:0 9px 20px #bd3f6822}
.grid{padding:0 24px 112px;gap:18px}.book{border-radius:22px;box-shadow:0 10px 28px #7c4d6415}.meta{padding:14px 15px 16px}.cover{font-size:20px}
.head{min-height:70px;padding:22px 24px 12px}.hero{margin:8px 24px 0;min-height:270px;border-radius:28px;padding:28px;background:linear-gradient(145deg,#5d2b59 0%,#b83f70 52%,#f0a7bd 100%);box-shadow:0 16px 35px #a95a7d24}.hero h1{font-size:34px;line-height:1.05;max-width:90%}
.infoTabs{margin:18px 24px 0;padding-bottom:4px;gap:8px}.infoTabs button{font-size:15px;padding:10px 15px}
.section{margin:16px 24px;padding:22px;border-radius:24px}.section h3{font-size:15px;letter-spacing:.08em}.section p{line-height:1.55}
.stats{margin:0 24px 16px;gap:9px}.stat{border:1px solid #f3e8ec;border-radius:19px;padding:13px 4px;font-size:12px}.stat b{font-size:19px;margin-bottom:3px}
.tools{margin:0 24px 112px;gap:11px}.tool{min-height:56px;border-radius:18px;padding:14px 16px;font-size:15px;box-shadow:0 6px 16px #7c4d6409}
.bottom{padding:12px 8px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #7c4d640d}.bottom span{font-size:12px}
@media(max-width:390px){.topbar .brand{font-size:25px}.hero h1{font-size:30px}.infoTabs{margin-left:18px;margin-right:18px}.infoTabs button{padding:9px 12px}.tools,.stats,.section,.hero{margin-left:18px;margin-right:18px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class='app'>
<section id='library' class='view active'><div class='topbar'><span style='font-size:24px'>☰</span><div class='brand'>Mis Novelas</div><span style='font-size:25px'>♕</span></div><div class='tabs'><div class='pill active'>Todas</div><div class='pill'>En progreso</div><div class='pill'>Completadas</div></div><button class='primary wideNew' onclick='openNew()'>＋ Nueva novela</button><div id='books' class='grid'></div></section>
<section id='novel' class='view'><div class='head'><button class='back' onclick="show('library')">‹</button><b>Mi novela</b><span></span></div><div id='hero' class='hero'><h1 id='novelTitle'></h1></div><div class='infoTabs'><button>Información</button><button onclick='renderChapters()'>Capítulos</button><button onclick='renderCharacters()'>Personajes</button><button onclick="alert('Mundo / Lore: siguiente módulo')">Mundo</button></div><div class='section'><h3>SINOPSIS</h3><p id='synopsis'></p></div><div class='stats'><div class='stat'><b id='statCh'>0</b>Capítulos</div><div class='stat'><b>—</b>Páginas</div><div class='stat'><b id='statWords'>0</b>Palabras</div><div class='stat'><b>✦</b>En progreso</div></div><div class='tools'><button class='tool' onclick='renderCharacters()'>👥 Personajes ›</button><button class='tool' onclick="alert('Notas: siguiente módulo')">📝 Notas ›</button><button class='tool' onclick="alert('Mundo / Lore: siguiente módulo')">🌐 Mundo / Lore ›</button><button class='tool' onclick="alert('Ideas: siguiente módulo')">💡 Ideas ›</button><button class='tool' onclick="alert('Línea temporal: siguiente módulo')">🗓 Línea temporal ›</button><button class='tool' onclick="alert('Escenas: siguiente módulo')">▣ Escenas ›</button></div><div class='section' id='chapters' style='display:none'></div><div class='section' id='characters' style='display:none'></div></section>
<section id='editor' class='view'><div class='head'><button class='back' onclick="show('novel')">‹</button><b>Editor</b><span>☁︎</span></div><div class='editor'><input id='chapterTitle' class='title' placeholder='Título del capítulo'><div class='editorbar'><button>↶</button><button>↷</button><button><b>B</b></button><button><i>I</i></button><button><u>U</u></button><button>☷</button></div><textarea id='chapterText' class='text' placeholder='Empieza a escribir tu historia...'></textarea><div id='status' class='status'>Guardado automáticamente · 0 palabras</div></div></section>
<nav class='bottom'><span>📚 Biblioteca</span><span>📝 Notas</span><span>💡 Ideas</span><span>⚙️ Ajustes</span></nav></main>
<div id='modal' class='modal'><div class='box'><h2>Nueva novela</h2><input id='newTitle' placeholder='Título'><textarea id='newSynopsis' placeholder='Sinopsis'></textarea><div class='row'><button class='pill' onclick='closeNew()'>Cancelar</button><button class='primary' onclick='createNovel()'>Crear novela</button></div></div></div>
<script>
const KEY='farybooks-v01';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{books:[{id:1,title:'Reclamada por el Rey Lycan',synopsis:'Una historia de secretos, poder y destino.',chapters:[{title:'El inicio de todo',text:''}]}]};let currentBook=1,currentChapter=0;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='library')renderBooks()}function renderBooks(){let el=document.getElementById('books');el.innerHTML=data.books.map(b=>`<article class="book" onclick="openBook(${b.id})"><div class="cover">${b.title}</div><div class="meta"><b>${b.title}</b><br><small>${b.chapters.length} capítulos</small><div class="progress"><i></i></div></div></article>`).join('')+`<article class="book new" onclick="openNew()"><div><div style="font-size:42px;text-align:center">＋</div>Nueva novela</div></article>`}function openNew(){modal.classList.add('show')}function closeNew(){modal.classList.remove('show')}function createNovel(){let t=newTitle.value.trim();if(!t)return;let id=Date.now();data.books.push({id,title:t,synopsis:newSynopsis.value.trim()||'Sin sinopsis todavía.',chapters:[]});save();newTitle.value='';newSynopsis.value='';closeNew();renderBooks()}function openBook(id){currentBook=id;let b=data.books.find(x=>x.id===id);novelTitle.textContent=b.title;synopsis.textContent=b.synopsis;chapters.innerHTML='';statCh.textContent=b.chapters.length;statWords.textContent=b.chapters.reduce((n,c)=>n+words(c.text),0).toLocaleString('es-MX');show('novel')}function renderChapters(){characters.style.display='none';chapters.style.display='block';let b=data.books.find(x=>x.id===currentBook);chapters.innerHTML='<h3>Capítulos</h3>'+b.chapters.map((c,i)=>`<div class="chapter" onclick="openChapter(${i})"><b>${i+1}. ${c.title||'Sin título'}</b><br><small>${words(c.text)} palabras</small></div>`).join('')+`<button class="primary" style="width:100%;margin-top:14px" onclick="addChapter()">+ Nuevo capítulo</button>`}function renderCharacters(){chapters.style.display='none';characters.style.display='block';let b=data.books.find(x=>x.id===currentBook);b.characters=b.characters||[];characters.innerHTML='<h3>Personajes</h3>'+b.characters.map((p,i)=>`<div class="chapter"><b>${p.name}</b><br><small>${p.role||'Sin rol'} · ${p.notes||'Sin notas'}</small><div style="margin-top:8px"><button class="pill" onclick="editCharacter(${i})">Editar</button> <button class="pill" onclick="deleteCharacter(${i})">Eliminar</button></div></div>`).join('')+`<button class="primary" style="width:100%;margin-top:14px" onclick="addCharacter()">+ Nuevo personaje</button>`;save()}function addCharacter(){let name=prompt('Nombre del personaje');if(!name)return;let role=prompt('Rol (protagonista, antagonista, secundario...)')||'';let notes=prompt('Descripción o notas')||'';let b=data.books.find(x=>x.id===currentBook);b.characters=b.characters||[];b.characters.push({name,role,notes});save();renderCharacters()}function editCharacter(i){let b=data.books.find(x=>x.id===currentBook),p=b.characters[i];let name=prompt('Nombre',p.name);if(name===null)return;p.name=name.trim()||p.name;let role=prompt('Rol',p.role||'');if(role!==null)p.role=role;let notes=prompt('Descripción o notas',p.notes||'');if(notes!==null)p.notes=notes;save();renderCharacters()}function deleteCharacter(i){if(!confirm('¿Eliminar este personaje?'))return;let b=data.books.find(x=>x.id===currentBook);b.characters.splice(i,1);save();renderCharacters()}function addChapter(){let b=data.books.find(x=>x.id===currentBook);b.chapters.push({title:'Nuevo capítulo',text:''});save();renderChapters()}function openChapter(i){currentChapter=i;let c=data.books.find(x=>x.id===currentBook).chapters[i];chapterTitle.value=c.title;chapterText.value=c.text;updateStatus();show('editor')}function words(s){return (s.trim().match(/\S+/g)||[]).length}function updateStatus(){status.textContent=`Guardado automáticamente · ${words(chapterText.value)} palabras`}function editSave(){let c=data.books.find(x=>x.id===currentBook).chapters[currentChapter];c.title=chapterTitle.value;c.text=chapterText.value;save();updateStatus()}chapterTitle.addEventListener('input',editSave);chapterText.addEventListener('input',editSave);renderBooks();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
