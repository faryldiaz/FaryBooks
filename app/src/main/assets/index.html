input,.worldPage textarea{width:100%;border:1px solid #ead7dd;border-radius:14px;background:#fff;padding:12px 13px;margin:0 0 10px;outline:none}.noteEdit textarea{width:100%;min-height:58vh;border:0;background:transparent;padding:8px 3px;font-family:var(--editor-font)!important;font-size:var(--editor-size)!important;line-height:var(--editor-line)!important;outline:none;resize:none}.moduleActions{display:flex;gap:9px;position:sticky;bottom:0;background:#fffaf9ee;padding:10px 0}.moduleActions button{flex:1}.worldCats{display:flex;gap:7px;overflow:auto;padding:2px 0 13px}.worldCats button{white-space:nowrap}.worldEntry{background:#fff;border:1px solid #eedfe4;border-radius:18px;padding:15px;margin-bottom:10px}.worldEntry h3{margin:0 0 4px}.worldEntry p{white-space:pre-line;color:#6f5962}.worldEntryActions{display:flex;gap:7px;margin-top:10px}.worldFormGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.worldFormGrid .full{grid-column:1/-1}.worldPage textarea{min-height:34vh}@media(max-width:430px){.worldFormGrid{grid-template-columns:1fr}.worldFormGrid .full{grid-column:auto}}.topIcon{border:0;background:transparent;font-size:25px;color:var(--ink);padding:7px;min-width:40px}.crownBtn{color:#a77a39}.authorStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.authorStat{background:#fff6f8;border:1px solid #f0dfe5;border-radius:16px;padding:13px 5px;text-align:center}.authorStat b{display:block;font-size:21px;color:#9f365b}.goalBar{height:8px;background:#f0e1e6;border-radius:9px;overflow:hidden;margin:10px 0}.goalBar i{display:block;height:100%;background:var(--rose)}.menuCard{width:100%;text-align:left;margin:7px 0}.worldInlineCats{display:flex;gap:7px;overflow:auto;margin:10px 0 14px}.worldInlineItem{padding:13px 0;border-bottom:1px solid #f0e3e8}.worldInlineItem:last-of-type{border-bottom:0}.worldInlineItem small{display:block;color:var(--muted);margin-top:3px}body.themeDark{background:#17131a;color:#f5edf2}body.themeDark .app,body.themeDark .section,body.themeDark .stat,body.themeDark .tool,body.themeDark .book,body.themeDark .sheetCard,body.themeDark .modulePage,body.themeDark .noteCard,body.themeDark input,body.themeDark textarea,body.themeDark select{background:#211b23!important;color:#f5edf2!important}body.themeDark .bottom{background:#1c171eee!important}body.palettePurple{--rose:#7953b7;--pink:#e9dff8;--lav:#ddd0f5}body.paletteBlue{--rose:#426b9c;--pink:#dce9f4;--lav:#dce8f5}body.paletteBeige{--rose:#9b7355;--pink:#efe2d5;--lav:#eee5dc}.paletteChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.paletteChoice{padding:12px;border-radius:14px;border:1px solid #eadce1;background:#fff}.paletteDot{width:100%;height:12px;border-radius:8px;margin-bottom:7px}</style></head><body><main class='app'>
<section id='library' class='view active'><div class='topbar'><button class='topIcon' onclick='openMainMenu()'>☰</button><div class='brand'>Mis Novelas</div><button class='topIcon crownBtn' onclick='openAuthorSpace()'>♕</button></div><div class='tabs' id="libraryTabs"><div class='pill active' onclick="filterBooks('all',this)">Todas</div><div class='pill' onclick="filterBooks('progress',this)">En progreso</div><div class='pill' onclick="filterBooks('completed',this)">Completadas</div></div><button class='primary wideNew' onclick='openNew()'>＋ Nueva novela</button><div id='books' class='grid'></div></section>
<section id='novel' class='view'><div class='head'><button class='back' onclick="show('library')">‹</button><b>Mi novela</b><span></span></div><div id='hero' class='hero'><h1 id='novelTitle'></h1><button class="editBookBtn" onclick="bookForm()">✎ Editar novela</button></div><input id="coverPicker" type="file" accept="image/*" style="display:none" onchange="applyCover(this)"><div class='infoTabs'><button data-tab="info" class="active" onclick="showNovelTab('info',this)">Información</button><button data-tab="chapters" onclick="showNovelTab('chapters',this)">Capítulos</button><button data-tab="characters" onclick="showNovelTab('characters',this)">Personajes</button><button data-tab="world" onclick="showNovelTab('world',this)">Mundo</button></div><div id="novelInfo"><div class='section synopsisBox'><h3>SINOPSIS</h3><p id='synopsis' class="synopsisCollapsed" onclick="collapseSynopsisIfOpen()"></p><button id="synopsisToggle" class="synopsisToggle" onclick="toggleSynopsis()">Leer más⌄</button></div><div class='stats'><div class='stat'><b id='statCh'>0</b>Capítulos</div><div class='stat'><b id='statPages'>0</b>≈ Páginas</div><div class='stat'><b id='statWords'>0</b>Palabras</div><div class='stat statusCard' onclick="openStatusPicker()"><b id="statStatusIcon">✦</b><span id="statStatus">En progreso</span><small>Cambiar⌄</small></div></div><div class='tools'><button class='tool' onclick='renderCharacters()'>♙ &nbsp;Personajes</button><button class='tool' onclick="openWorkspace('notes')">▤ &nbsp;Notas</button><button class='tool' onclick="openWorld()">◎ &nbsp;Mundo / Lore</button><button class='tool' onclick="openWorkspace('ideas')">✧ &nbsp;Ideas</button><button class='tool' onclick="openWorkspace('timeline')">◫ &nbsp;Línea temporal</button><button class='tool' onclick="openWorkspace('scenes')">▣ &nbsp;Escenas</button></div></div><div class='section' id='chapters' style='display:none'></div><div class='section' id='characters' style='display:none'></div><div class='section' id='worldPanel' style='display:none'></div></section>
<section id='editor' class='view'><div class='head'><button class='back' onclick="show('novel')">‹</button><b>Editor</b><span>☁︎</span></div><div class='editor'><input id='chapterTitle' class='title' placeholder='Título del capítulo'><div class='editorbar'><button onclick="document.execCommand('undo')">↶</button><button onclick="document.execCommand('redo')">↷</button><button id="boldBtn" onclick="toggleFmt('bold')"><b>B</b></button><button id="italicBtn" onclick="toggleFmt('italic')"><i>I</i></button><button id="underlineBtn" onclick="toggleFmt('underline')"><u>U</u></button><button onclick="insertList()">☷</button><button class="focusBtn" onclick="toggleFocus()">◉ Foco</button><button class="editorSave" onclick="manualSave()">Guardar</button></div><textarea id='chapterText' class='text' placeholder='Empieza a escribir tu historia...'></textarea><div id='status' class='status'>Guardado automáticamente · 0 palabras</div></div></section>
<nav class='bottom'><span onclick="show('library')">▥ Biblioteca</span><span onclick="openWorkspace('notes')">▤ Notas</span><span onclick="openFaryAI()">✦ FaryAI</span><span onclick="openSettings()">⚙ Ajustes</span></nav></main>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheetCard"><div id="sheetContent"></div></div></div><div id='modal' class='modal'><div class='box'><h2>Nueva novela</h2><input id='newTitle' placeholder='Título'><textarea id='newSynopsis' placeholder='Sinopsis'></textarea><div class='row'><button class='pill' onclick='closeNew()'>Cancelar</button><button class='primary' onclick='createNovel()'>Crear novela</button></div></div></div>
<script>
const KEY='farybooks-v01';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{books:[]};let currentBook=1,currentChapter=0;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='library')renderBooks()}let libraryFilter='all';function filterBooks(filter,el){libraryFilter=filter;document.querySelectorAll('#libraryTabs .pill').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderBooks()}function renderBooks(){let el=document.getElementById('books'),list=data.books.filter(b=>libraryFilter==='all'||(b.status||'progress')===libraryFilter);let cards=list.map(b=>`<article class="book" onclick="openBook(${b.id})"><div class="cover" ${b.cover?`style="background-image:url('${b.cover}');background-size:cover;background-position:center;color:white;text-shadow:0 2px 8px #0008"`:''}><button class="bookMenu" onclick="event.stopPropagation();openBookMenu(${b.id})">⋮</button>${b.cover?'':b.title}</div><div class="meta"><b>${b.title}</b><br><small>${b.chapters.length} capítulos · ${(b.status||'progress')==='completed'?'Terminada':(b.status==='paused'?'En pausa':'En progreso')}</small><div class="progress"><i></i></div></div></article>`).join('');if(data.books.length){el.innerHTML=cards+`<article class="book new" onclick="openNew()"><div><div style="font-size:42px;text-align:center">＋</div>Nueva novela</div></article>`;if(!list.length)el.innerHTML='<div class="emptyFilter">Todavía no tienes novelas en esta categoría.</div>';return}if(libraryFilter!=='all'){el.innerHTML='<div class="emptyFilter">Todavía no tienes novelas en esta categoría.</div>';return}el.innerHTML='<div class="onboarding"><h2>Bienvenida a FaryBooks</h2><p>Tu espacio para escribir, construir mundos y organizar tus historias.</p><div class="startGrid"><button class="startCard" onclick="openQuickGuide()"><b>✦ Guía rápida</b><span>Conoce las herramientas principales de FaryBooks.</span></button><button class="startCard" onclick="createDemoProject()"><b>▣ Proyecto de ejemplo</b><span>Explora una novela ficticia ya organizada.</span></button><button class="startCard" onclick="openWritingTips()"><b>❀ Consejos para comenzar</b><span>Ideas breves para planificar tu historia.</span></button></div></div>'}function openBookMenu(id){let b=data.books.find(x=>x.id===id);if(!b)return;currentBook=id;sheetContent.innerHTML='<h2>'+esc(b.title)+'</h2><button class="startCard" style="width:100%" onclick="closeSheet();openBook('+id+')"><b>✎ Abrir / editar</b><span>Entra al proyecto y modifica su información.</span></button><button class="startCard" style="width:100%;margin-top:8px" onclick="showBookExport()"><b>⇩ Exportar novela</b><span>Todos sus capítulos en Word o PDF.</span></button><button class="startCard" style="width:100%;margin-top:8px" onclick="duplicateBook('+id+')"><b>▣ Duplicar novela</b><span>Crea una copia independiente.</span></button><button class="startCard" style="width:100%;margin-top:8px" onclick="archiveBook('+id+')"><b>▤ Archivar</b><span>Guarda el proyecto fuera de los activos.</span></button><button class="startCard dangerBtn" style="width:100%;margin-top:8px" onclick="confirmTrashBook('+id+')"><b>♲ Mover a la papelera</b><span>Podrás recuperarla después.</span></button>';sheet.classList.add('show')}function duplicateBook(id){let b=data.books.find(x=>x.id===id);if(!b)return;let c=JSON.parse(JSON.stringify(b));c.id=Date.now();c.title=b.title+' — copia';data.books.push(c);save();closeSheet();renderBooks()}function archiveBook(id){let b=data.books.find(x=>x.id===id);if(!b)return;b.status='paused';b.archived=true;save();closeSheet();renderBooks()}
function confirmTrashBook(id){let b=data.books.find(x=>x.id===id);if(!b)return;sheetContent.innerHTML='<h2>¿Eliminar novela?</h2><p>¿Estás segura de que quieres mover <b>'+esc(b.title)+'</b> a la papelera?</p><p style="color:#806b74">No se borrará definitivamente y podrás recuperarla desde Ajustes → Papelera.</p><div class="formActions"><button class="pill" onclick="openBookMenu('+id+')">Cancelar</button><button class="primary" onclick="trashBook('+id+')">Mover a papelera</button></div>'}function trashBook(id){data.trash=data.trash||[];let i=data.books.findIndex(x=>x.id===id);if(i<0)return;let b=data.books.splice(i,1)[0];b.deletedAt=Date.now();data.trash.unshift(b);save();closeSheet();renderBooks()}let trashReturn='settings';function openTrash(from='settings'){trashReturn=from;data.trash=data.trash||[];sheetContent.innerHTML='<h2>Papelera</h2>'+(data.trash.length?data.trash.map((b,i)=>'<div class="trashItem"><b>'+esc(b.title)+'</b><small style="display:block;color:#8b7480;margin-top:4px">Novela eliminada</small><div class="trashActions"><button class="pill" onclick="restoreBook('+i+')">↶ Recuperar</button><button class="pill dangerBtn" onclick="confirmPermanentDelete('+i+')">Eliminar definitivamente</button></div></div>').join(''):'<div class="empty">La papelera está vacía.</div>')+'<button class="pill" style="width:100%;margin-top:15px" onclick="trashBack()">‹ Volver</button>';sheet.classList.add('show')}function trashBack(){if(trashReturn==='menu')openMainMenu();else openSettings()}function restoreBook(i){data.trash=data.trash||[];let b=data.trash.splice(i,1)[0];if(!b)return;delete b.deletedAt;data.books.push(b);save();openTrash();renderBooks()}function confirmPermanentDelete(i){let b=(data.trash||[])[i];if(!b)return;sheetContent.innerHTML='<h2>Eliminar definitivamente</h2><p><b>'+esc(b.title)+'</b> se borrará para siempre junto con sus capítulos, personajes y demás información.</p><p><b>Esta acción no se puede deshacer.</b></p><div class="formActions"><button class="pill" onclick="openTrash()">Cancelar</button><button class="primary" onclick="permanentDelete('+i+')">Eliminar definitivamente</button></div>'}function permanentDelete(i){data.trash.splice(i,1);save();openTrash()}
function openQuickGuide(){sheetContent.innerHTML='<h2>Guía rápida</h2><div class="listItem"><b>1. Crea tu novela</b>Usa + Nueva novela y añade título, sinopsis y portada.</div><div class="listItem"><b>2. Escribe capítulos</b>Organiza tu manuscrito y consulta el recuento de palabras.</div><div class="listItem"><b>3. Construye tu historia</b>Crea personajes, mundo, notas, ideas, escenas y línea temporal.</div><button class="primary" style="width:100%;margin-top:15px" onclick="closeSheet()">Entendido</button>';sheet.classList.add('show')}function openWritingTips(){sheetContent.innerHTML='<h2>Consejos para comenzar</h2><div class="listItem"><b>Empieza por el conflicto</b>Resume en una frase qué quiere tu protagonista y qué se lo impide.</div><div class="listItem"><b>Conoce a tus personajes</b>Define deseo, miedo, pasado y relaciones antes de llenar detalles menores.</div><div class="listItem"><b>Construye solo lo necesario</b>Agrega al Mundo / Lore aquello que afecte realmente la historia.</div><button class="primary" style="width:100%;margin-top:15px" onclick="closeSheet()">Listo</button>';sheet.classList.add('show')}function createDemoProject(){let id=Date.now();data.books.push({id,title:'Proyecto de ejemplo',synopsis:'Esta novela ficticia te permite explorar cómo se organizan las herramientas de FaryBooks. Puedes editarla, experimentar con ella o eliminarla cuando quieras.',status:'progress',chapters:[{title:'Capítulo de muestra',text:'Este es un espacio de ejemplo para descubrir el editor de FaryBooks.'}],characters:[{name:'Personaje de ejemplo',role:'Protagonista',personality:'Una ficha sencilla para mostrar cómo puedes organizar tus personajes.'}],world:[{category:'General',title:'Mundo de ejemplo',subtitle:'Fantasía',text:'Explora las categorías de Mundo / Lore y reemplaza este contenido con tus propias ideas.'}]});save();renderBooks();openBook(id)}
function openNew(){modal.classList.add('show')}function closeNew(){modal.classList.remove('show')}function createNovel(){let t=newTitle.value.trim();if(!t)return;let id=Date.now();data.books.push({id,title:t,synopsis:newSynopsis.value.trim()||'Sin sinopsis todavía.',status:'progress',chapters:[]});save();newTitle.value='';newSynopsis.value='';closeNew();renderBooks()}function refreshBookInfo(){let b=book();novelTitle.textContent=b.title;synopsis.textContent=b.synopsis||'Sin sinopsis todavía.';synopsis.className='synopsisCollapsed';let st=document.getElementById('synopsisToggle');if(st)st.textContent='Leer más⌄';statCh.textContent=b.chapters.length;let totalWords=b.chapters.reduce((n,c)=>n+words(c.text),0);statWords.textContent=totalWords.toLocaleString('es-MX');let pg=document.getElementById('statPages');if(pg)pg.textContent=Math.ceil(totalWords/250);let bookStatus=b.status||'progress',labels={progress:'En progreso',paused:'En pausa',completed:'Terminada'},icons={progress:'✦',paused:'Ⅱ',completed:'✓'};let statusEl=document.getElementById('statStatus'),statusIconEl=document.getElementById('statStatusIcon');if(statusEl)statusEl.textContent=labels[bookStatus];if(statusIconEl)statusIconEl.textContent=icons[bookStatus];hero.classList.toggle('hasCover',!!b.cover);hero.style.backgroundImage=b.cover?'url("'+b.cover+'")':''}function openBook(id){currentBook=id;let b=book();chapters.innerHTML='';refreshBookInfo();show('novel');activateNovelTab('info')}function activateNovelTab(name){document.querySelectorAll('.infoTabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));let info=document.getElementById('novelInfo');if(info)info.style.display=name==='info'?'block':'none';chapters.style.display=name==='chapters'?'block':'none';characters.style.display=name==='characters'?'block':'none';let wp=document.getElementById('worldPanel');if(wp)wp.style.display=name==='world'?'block':'none'}function showNovelTab(name,el){activateNovelTab(name);if(name==='chapters'){renderChapters();return}if(name==='characters'){renderCharacters();return}if(name==='world'){openWorld();return}}function openWorld(cat='General'){activateNovelTab('world');renderWorld(cat)}
function renderWorld(cat='General'){let b=book(),p=document.getElementById('worldPanel');if(!b||!p)return;b.world=b.world||[];p.style.display='block';let cats=['General','Lugares','Países / Reinos','Razas','Poderes','Gobierno','Religión','Historia','Reglas'],items=b.world.filter(x=>(x.category||'General')===cat);p.innerHTML='<h3>MUNDO / LORE</h3><div class="empty" style="padding:12px 0">Construye los lugares, pueblos, poderes, culturas y reglas que dan vida a tu universo.</div><div class="worldInlineCats">'+cats.map(c=>'<button class="pill '+(c===cat?'active':'')+'" onclick="renderWorld(\''+c+'\')">'+c+'</button>').join('')+'</div>'+(items.length?items.map(x=>{let i=b.world.indexOf(x);return '<div class="worldInlineItem" onclick="worldForm(\''+cat+'\','+i+')"><b>'+esc(x.title)+'</b><small>'+esc(x.subtitle||'')+(x.extra?' · '+esc(x.extra):'')+'</small></div>'}).join(''):'<div class="empty">Todavía no has agregado elementos en '+cat+'.</div>')+'<button class="primary" style="width:100%;margin-top:14px" onclick="worldForm(\''+cat+'\')">＋ Nuevo elemento del mundo</button>'}
function worldForm(cat,i=null){let b=book();b.world=b.world||[];let x=i===null?{}:b.world[i],h={General:'Nombre del mundo',Lugares:'Nombre del lugar','Países / Reinos':'País, reino o territorio',Razas:'Nombre de la raza',Poderes:'Nombre del poder o sistema mágico',Gobierno:'Gobierno / autoridad',Religión:'Religión, dioses o creencias',Historia:'Evento o periodo histórico',Reglas:'Regla del mundo'};sheetContent.innerHTML='<h2>'+(i===null?'Nuevo elemento':'Editar elemento')+'</h2><select id="wfCategory" onchange="worldForm(this.value,'+(i===null?'null':i)+')">'+Object.keys(h).map(c=>'<option '+(c===cat?'selected':'')+'>'+c+'</option>').join('')+'</select><input id="wfTitle" placeholder="'+h[cat]+'" value="'+esc(x.title||'')+'"><div class="row"><input id="wfSubtitle" placeholder="'+(cat==='General'?'Época':cat==='Gobierno'?'Gobernante / líder':'Región / clasificación')+'" value="'+esc(x.subtitle||'')+'"><input id="wfExtra" placeholder="'+(cat==='General'?'Tecnología / nivel social':cat==='Lugares'?'País / reino':'Dato clave')+'" value="'+esc(x.extra||'')+'"></div><textarea id="wfText" placeholder="Descripción, costumbres, funcionamiento, detalles importantes...">'+esc(x.text||'')+'</textarea><div class="formActions"><button class="pill" onclick="closeSheet()">Cancelar</button>'+(i!==null?'<button class="pill dangerBtn" onclick="deleteWorld('+i+',\''+cat+'\')">Eliminar</button>':'')+'<button class="primary" onclick="saveWorld(\''+cat+'\','+(i===null?'null':i)+')">Guardar</button></div>';sheet.classList.add('show')}
function saveWorld(cat,i){let title=wfTitle.value.trim();if(!title){wfTitle.focus();return}let x={category:wfCategory.value,title,subtitle:wfSubtitle.value.trim(),extra:wfExtra.value.trim(),text:wfText.value.trim()},b=book();if(i===null)b.world.push(x);else b.world[i]=x;save();closeSheet();renderWorld(x.category)}function deleteWorld(i,cat){if(!confirm('¿Eliminar este elemento de Mundo / Lore?'))return;book().world.splice(i,1);save();closeSheet();renderWorld(cat)}

function openSettings(){let p=getPrefs();sheetContent.innerHTML='<h2>Ajustes</h2><div class="settingsGroup"><h3>ESCRITURA</h3><div class="settingRow"><div><b>Tipografía</b><small>Estilo del manuscrito</small></div><select id="setFont" onchange="savePrefsFromUI()"><option value="Georgia">Georgia</option><option value="Arial">Arial</option><option value="serif">Serif clásica</option><option value="sans-serif">Sans moderna</option></select></div><div class="settingRow"><div><b>Tamaño</b><small><span id="sizeLabel">'+p.size+'</span> px</small></div><input id="setSize" type="range" min="14" max="24" value="'+p.size+'" oninput="savePrefsFromUI()"></div><div class="settingRow"><div><b>Interlineado</b><small>Altura entre líneas</small></div><input id="setLine" type="range" min="13" max="21" value="'+Math.round(p.line*10)+'" oninput="savePrefsFromUI()"></div><div class="settingRow"><div><b>Ancho del texto</b><small>Espacio de escritura</small></div><select id="setWidth" onchange="savePrefsFromUI()"><option value="100%">Amplio</option><option value="92%">Cómodo</option><option value="82%">Compacto</option></select></div><div id="settingsPreview" class="previewText">Así se verá tu historia mientras escribes en FaryBooks.</div></div><div class="settingsGroup"><h3>APARIENCIA</h3><div class="settingRow"><div><b>Tema</b><small>Claro, oscuro o sistema</small></div><select id="setTheme" onchange="savePrefsFromUI()"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="system">Sistema</option></select></div><h3 style="margin-top:18px">Personalizar FaryBooks</h3><div class="paletteChoices">'+[['rose','Rosa editorial','#bd3f68'],['purple','Morado','#7953b7'],['blue','Azul','#426b9c'],['beige','Beige','#9b7355']].map(x=>'<label class="paletteChoice"><div class="paletteDot" style="background:'+x[2]+'"></div><input type="radio" name="palette" value="'+x[0]+'" '+(p.palette===x[0]?'checked':'')+' onchange="savePrefsFromUI()"> '+x[1]+'</label>').join('')+'</div></div><div class="settingsGroup"><h3>SEGURIDAD</h3><button class="startCard" style="width:100%;margin-top:8px" onclick="exportBackup()"><b>⇩ Exportar copia de seguridad</b><span>Guarda todo tu FaryBooks en un archivo.</span></button><button class="startCard" style="width:100%;margin-top:8px" onclick="importBackup()"><b>⇧ Importar copia de seguridad</b><span>Recupera novelas, personajes, mundo y notas.</span></button><button class="startCard" style="width:100%;margin-top:8px" onclick="openTrash(\'menu\')"><b>♲ Papelera</b><span>Recupera novelas eliminadas o bórralas definitivamente.</span></button></div><button class="primary" style="width:100%;margin-top:15px" onclick="closeSheet()">Listo</button>';sheet.classList.add('show');setFont.value=p.font;setWidth.value=p.width;setTheme.value=p.theme}function esc(v){return String(v||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
let fmt={bold:false,italic:false,underline:false};function toggleFmt(k){fmt[k]=!fmt[k];document.getElementById(k+'Btn').classList.toggle('active',fmt[k]);chapterText.focus()}function stylize(t){let out=t;if(fmt.bold)out=toBold(out);if(fmt.italic)out=toItalic(out);if(fmt.underline)out=[...out].map(c=>c===' '?c:c+'̲').join('');return out}function toBold(t){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',b=[...'𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇'];return [...t].map(c=>a.includes(c)?b[a.indexOf(c)]:c).join('')}function toItalic(t){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',b=[...'𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻'];return [...t].map(c=>a.includes(c)?b[a.indexOf(c)]:c).join('')}chapterText.addEventListener('beforeinput',e=>{if(e.inputType==='insertText'&&e.data&&(fmt.bold||fmt.italic||fmt.underline)){e.preventDefault();let a=chapterText.selectionStart,b=chapterText.selectionEnd,v=stylize(e.data);chapterText.setRangeText(v,a,b,'end');editSave()}});function insertList(){let e=chapterText,start=e.selectionStart;e.setRangeText('\n• ',start,start,'end');e.focus();editSave()}
function toggleFocus(){document.querySelector('.app').classList.toggle('focus');document.querySelector('.focusBtn').textContent=document.querySelector('.app').classList.contains('focus')?'✕ Salir de foco':'◉ Foco'}
function handleAndroidBack(){let app=document.querySelector('.app');if(app.classList.contains('focus')){toggleFocus();return true}if(document.getElementById('modulePage')){closeModulePage();return true}if(document.getElementById('aiPage')){if(activeAIChat!==null){activeAIChat=null;renderAIHome()}else closeAIPage();return true}if(sheet.classList.contains('show')){closeSheet();return true}if(modal.classList.contains('show')){closeNew();return true}if(document.getElementById('editor').classList.contains('active')){show('novel');return true}if(document.getElementById('novel').classList.contains('active')){show('library');return true}return false}

function manualSave(){editSave();let el=document.getElementById('status');el.textContent='✓ Guardado · '+words(chapterText.value)+' palabras';setTimeout(updateStatus,1300)}
chapterTitle.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();editSave();chapterText.focus()}})
function cleanAIText(v){return String(v||'').replace(/\*\*(.*?)\*\*/g,'$1').replace(/^#{1,6}\s*/gm,'').replace(/^\*\s+/gm,'• ')}
function getPrefs(){try{return Object.assign({font:'Georgia',size:17,line:1.65,width:'100%',theme:'light',palette:'rose'},JSON.parse(localStorage.getItem('farybooks-prefs')||'{}'))}catch(e){return {font:'Georgia',size:17,line:1.65,width:'100%',theme:'light',palette:'rose'}}}
function applyPrefs(){let p=getPrefs(),r=document.documentElement.style;r.setProperty('--editor-font',p.font);r.setProperty('--editor-size',p.size+'px');r.setProperty('--editor-line',p.line);r.setProperty('--editor-width',p.width);let dark=p.theme==='dark'||(p.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('nightTheme',dark);document.body.classList.toggle('themeDark',dark);document.body.classList.remove('palettePurple','paletteBlue','paletteBeige');if(p.palette==='purple')document.body.classList.add('palettePurple');if(p.palette==='blue')document.body.classList.add('paletteBlue');if(p.palette==='beige')document.body.classList.add('paletteBeige')}
function savePrefsFromUI(){let p={font:setFont.value,size:+setSize.value,line:+setLine.value/10,width:setWidth.value,theme:setTheme.value,palette:(document.querySelector('input[name=palette]:checked')||{}).value||getPrefs().palette};localStorage.setItem('farybooks-prefs',JSON.stringify(p));sizeLabel.textContent=p.size;applyPrefs();let v=document.getElementById('settingsPreview');if(v){v.style.fontFamily=p.font;v.style.fontSize=p.size+'px';v.style.lineHeight=p.line}}
function chapterOptions(i){let b=book(),c=b.chapters[i];sheetContent.innerHTML='<h2>'+esc(c.title||'Capítulo '+(i+1))+'</h2><button class="startCard" style="width:100%;margin:6px 0" onclick="exportChapter('+i+',\'docx\')"><b>W Exportar a Word</b><span>Documento .docx</span></button><button class="startCard" style="width:100%;margin:6px 0" onclick="exportChapter('+i+',\'pdf\')"><b>PDF Exportar a PDF</b><span>Documento listo para compartir</span></button><button class="pill" style="width:100%;margin-top:12px" onclick="closeSheet()">Cancelar</button>';sheet.classList.add('show')}
function exportChapter(i,format){let c=book().chapters[i],title=c.title||('Capítulo '+(i+1));exportDocument(title,title+'\n\n'+plainText(c.text||''),format)}
function exportNovel(format){let b=book();if(!b)return;let text=b.title+'\n\n'+b.chapters.map((c,i)=>(c.title||('Capítulo '+(i+1)))+'\n\n'+plainText(c.text||'')).join('\n\n\n');exportDocument(b.title,text,format)}
function exportDocument(title,text,format){if(window.FaryNative&&FaryNative.exportDocument){FaryNative.exportDocument(title,text,format);return}alert('La exportación está disponible en la aplicación Android.')}
function exportBackup(){let payload=JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:data,aiChats:aiChats,prefs:getPrefs()});if(window.FaryNative&&FaryNative.exportBackup)FaryNative.exportBackup(payload);else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));a.download='FaryBooks-backup.json';a.click()}}
function importBackup(){if(window.FaryNative&&FaryNative.importBackup)FaryNative.importBackup();else alert('La importación está disponible en la aplicación Android.')}
function receiveBackup(payload){try{let b=JSON.parse(payload);if(!b||!b.data||!Array.isArray(b.data.books))throw 0;if(!confirm('¿Restaurar esta copia? Se reemplazarán los datos actuales de FaryBooks.'))return;data=b.data;aiChats=Array.isArray(b.aiChats)?b.aiChats:aiChats;if(b.prefs)localStorage.setItem('farybooks-prefs',JSON.stringify(b.prefs));save();saveAIChats();applyPrefs();closeSheet();renderBooks();alert('Copia restaurada correctamente ✓')}catch(e){alert('Esta copia de seguridad no es válida.')}}
window.receiveBackup=receiveBackup;
function showBookExport(){let b=book();sheetContent.innerHTML='<h2>Exportar novela</h2><p>'+esc(b.title)+'</p><button class="startCard" style="width:100%;margin:6px 0" onclick="exportNovel(\'docx\')"><b>W Word completo</b><span>Todos los capítulos en un solo .docx</span></button><button class="startCard" style="width:100%;margin:6px 0" onclick="exportNovel(\'pdf\')"><b>PDF completo</b><span>Todos los capítulos en un solo PDF</span></button>';sheet.classList.add('show')}
function openModulePage(title,body){closeSheet();let o=document.getElementById('modulePage');if(o)o.remove();let p=document.createElement('div');p.id='modulePage';p.className='modulePage';p.innerHTML='<div class="moduleTop"><button class="back" onclick="closeModulePage()">‹</button><h1>'+esc(title)+'</h1><span class="spacer"></span></div><div class="moduleBody">'+body+'</div>';document.body.appendChild(p)}function closeModulePage(){let p=document.getElementById('modulePage');if(p)p.remove()}
let noteFilter='all';function globalNotes(){data.notes=data.notes||[];return data.notes}function openNotes(f='all'){noteFilter=f;renderNotesPage()}function noteRows(q=''){return globalNotes().map((n,i)=>({n,i})).filter(o=>noteFilter==='all'||(noteFilter==='pinned'&&o.n.pinned)||o.n.category===noteFilter).filter(o=>!q||(o.n.title+' '+o.n.text).toLowerCase().includes(q)).sort((a,b)=>(b.n.pinned?1:0)-(a.n.pinned?1:0)||((b.n.updatedAt||0)-(a.n.updatedAt||0)))}function notesHTML(ns){return ns.length?ns.map(o=>{let n=o.n,d=n.updatedAt?new Date(n.updatedAt).toLocaleDateString('es-MX',{day:'numeric',month:'short'}):'Sin fecha';return '<div class="noteCard" onclick="editNote('+o.i+')"><button class="noteStar" onclick="event.stopPropagation();toggleNotePin('+o.i+')">'+(n.pinned?'★':'☆')+'</button><h3>'+esc(n.title||'Sin título')+'</h3><p>'+esc(n.text||'Sin contenido')+'</p><div class="noteMeta"><span class="noteTag">'+esc(n.category||'Idea')+'</span><span>'+d+'</span></div><button class="noteDots" onclick="event.stopPropagation();noteOptions('+o.i+')">⋮</button></div>'}).join(''):'<div class="aiEmpty"><div style="font-size:38px">▤</div><h2>Tu cuaderno creativo</h2><p>Guarda ideas, investigación, escenas y recordatorios aunque todavía no hayas creado una novela.</p></div>'}function renderNotesPage(){let body='<input id="noteSearch" class="moduleSearch" placeholder="Buscar notas…" oninput="renderNotesListOnly()"><div class="noteFilters">'+[['all','Todas'],['pinned','★ Fijadas'],['Idea','Ideas'],['Investigación','Investigación']].map(x=>'<button class="'+(noteFilter===x[0]?'active':'')+'" onclick="noteFilter=\''+x[0]+'\';renderNotesPage()">'+x[1]+'</button>').join('')+'</div><div id="noteList" class="noteList">'+notesHTML(noteRows())+'</div><button class="moduleFab" onclick="editNote()">＋</button>';openModulePage('Notas',body)}function renderNotesListOnly(){let q=(noteSearch.value||'').toLowerCase().trim();noteList.innerHTML=notesHTML(noteRows(q))}function editNote(i=null){let n=i===null?{}:globalNotes()[i];openModulePage(i===null?'Nueva nota':'Editar nota','<div class="noteEdit"><input id="noteTitle" placeholder="Título de la nota" value="'+esc(n.title||'')+'"><select id="noteCategory"><option>Idea</option><option>Investigación</option><option>Escena</option><option>Recordatorio</option></select><textarea id="noteText" placeholder="Escribe aquí…">'+esc(n.text||'')+'</textarea><div class="moduleActions"><button class="pill" onclick="openNotes()">Cancelar</button><button class="primary" onclick="saveNote('+(i===null?'null':i)+')">Guardar</button></div></div>');noteCategory.value=n.category||'Idea'}function saveNote(i){let title=noteTitle.value.trim(),text=noteText.value;if(!title&&!text.trim())return;let arr=globalNotes(),old=i===null?{}:arr[i],n={title:title||'Sin título',text,category:noteCategory.value,pinned:!!old.pinned,updatedAt:Date.now()};if(i===null)arr.unshift(n);else arr[i]=n;save();openNotes()}function toggleNotePin(i){let n=globalNotes()[i];n.pinned=!n.pinned;n.updatedAt=Date.now();save();renderNotesPage()}function noteOptions(i){let n=globalNotes()[i];if(confirm('¿Eliminar la nota “'+(n.title||'Sin título')+'”?')){globalNotes().splice(i,1);save();renderNotesPage()}}
function openMainMenu(){sheetContent.innerHTML='<h2>FaryBooks</h2><button class="startCard menuCard" onclick="closeSheet();show(\'library\')"><b>▥ Mi biblioteca</b><span>Todas tus novelas y proyectos.</span></button><button class="startCard menuCard" onclick="openTrash()"><b>♲ Papelera</b><span>Recupera novelas eliminadas.</span></button><button class="startCard menuCard" onclick="exportBackup()"><b>⇩ Copia de seguridad</b><span>Guarda todos tus datos.</span></button><button class="startCard menuCard" onclick="importBackup()"><b>⇧ Importar proyecto</b><span>Restaura una copia de FaryBooks.</span></button><button class="startCard menuCard" onclick="openQuickGuide()"><b>✦ Ayuda / Guía</b><span>Aprende a usar las herramientas principales.</span></button><button class="startCard menuCard" onclick="showAbout()"><b>♡ Acerca de FaryBooks</b><span>Tu espacio para escribir y construir historias.</span></button>';sheet.classList.add('show')}function showAbout(){sheetContent.innerHTML='<h2>FaryBooks</h2><p>Un espacio creado para escribir novelas, organizar personajes, construir mundos y acompañar tu proceso creativo.</p><button class="primary" style="width:100%" onclick="closeSheet()">Listo</button>'}
function openAuthorSpace(){let books=data.books||[],chap=books.reduce((n,b)=>n+(b.chapters||[]).length,0),wc=books.reduce((n,b)=>n+(b.chapters||[]).reduce((m,c)=>m+words(c.text),0),0),goal=+(localStorage.getItem('farybooks-word-goal')||10000),bookGoal=+(localStorage.getItem('farybooks-book-goal')||10),done=books.filter(b=>b.status==='completed').length,bookPct=Math.min(100,Math.round(done/Math.max(bookGoal,1)*100)),pct=Math.min(100,Math.round(wc/Math.max(goal,1)*100));sheetContent.innerHTML='<h2>♕ Mi espacio de autora</h2><div class="authorStats"><div class="authorStat"><b>'+books.length+'</b>Novelas</div><div class="authorStat"><b>'+chap+'</b>Capítulos</div><div class="authorStat"><b>'+wc.toLocaleString('es-MX')+'</b>Palabras</div></div><h3>Meta de escritura</h3><div class="goalBar"><i style="width:'+pct+'%"></i></div><small>'+wc.toLocaleString('es-MX')+' / '+goal.toLocaleString('es-MX')+' palabras</small><div class="settingRow" style="margin-top:14px"><div><b>Meta total</b><small>Configura tu objetivo de palabras</small></div><input id="authorGoal" type="number" min="100" step="100" value="'+goal+'" style="width:120px"></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveAuthorGoal()">Guardar meta</button><h3 style="margin-top:22px">Meta de libros</h3><div class="goalBar"><i style="width:'+bookPct+'%"></i></div><small>'+done+' / '+bookGoal+' libros completados</small><div class="settingRow" style="margin-top:12px"><div><b>Libros que quieres escribir</b><small>Tu meta personal</small></div><input id="authorBookGoal" type="number" min="1" value="'+bookGoal+'" style="width:90px"></div><div class="settingsGroup"><h3>PROYECTOS</h3><p>En progreso: '+books.filter(b=>(b.status||'progress')==='progress').length+' · Completados: '+books.filter(b=>b.status==='completed').length+'</p></div>';sheet.classList.add('show')}function saveAuthorGoal(){let v=Math.max(100,+authorGoal.value||10000),bg=Math.max(1,+authorBookGoal.value||10);localStorage.setItem('farybooks-word-goal',v);localStorage.setItem('farybooks-book-goal',bg);openAuthorSpace()}
applyPrefs();

renderBooks();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
