0px;background:#fff;border-radius:20px;box-shadow:0 8px 24px #7c4d6410}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{padding:14px;border-radius:15px;background:var(--rose);color:white}.chapter{padding:16px;border-bottom:1px solid #f0e3e8;cursor:pointer}.chapter:last-child{border:0}.editor{padding:0 22px 100px}.title{width:100%;border:0;background:transparent;font-size:27px;padding:10px 0;outline:none}.text{width:100%;min-height:55vh;border:0;background:#fff;border-radius:20px;padding:20px;line-height:1.7;font-size:18px;outline:none;resize:vertical}.text:empty:before{content:attr(data-placeholder);color:#a9919b}.text:focus{outline:none}.status{color:var(--muted);padding:10px 4px;font-size:14px}.modal{position:fixed;inset:0;background:#33202a77;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.box{background:#fff;width:min(460px,100%);padding:24px;border-radius:24px}.box input,.box textarea{width:100%;padding:12px;border:1px solid #eadce1;border-radius:12px;margin:7px 0}.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
.topbar{padding:18px 22px 8px;display:flex;align-items:center;gap:16px}.topbar .brand{flex:1;text-align:center;font-size:30px}.wideNew{margin:8px 22px 18px;width:calc(100% - 44px);font-size:17px}.cover{position:relative}.cover:after{content:'⋮';position:absolute;right:12px;top:10px;font-size:25px}.progress{height:4px;background:#eadde2;border-radius:5px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--rose);width:25%}.hero{position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:22px;top:18px;font-size:28px;opacity:.6}.infoTabs{display:flex;gap:7px;margin:14px 22px 0;overflow:auto}.infoTabs button{border:0;background:#f7edf1;padding:10px 14px;border-radius:18px;white-space:nowrap}.infoTabs button:first-child{background:var(--rose);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 22px 14px}.stat{background:white;border-radius:16px;padding:12px 5px;text-align:center;box-shadow:0 5px 16px #7c4d6410}.stat b{display:block;font-size:18px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 22px 100px}.tool{background:white;border:1px solid #f0e1e6;border-radius:15px;padding:14px;text-align:left;cursor:pointer}.chapter{display:flex;justify-content:space-between;align-items:center;gap:10px}.chapter small{color:var(--muted)}.chapterNum{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#f4cad8;margin-right:10px}.editorbar{display:flex;gap:8px;overflow:auto;padding:10px 0}.editorbar button{border:1px solid #eadce1;background:white;border-radius:10px;padding:8px 10px}.bottom span{cursor:pointer}

/* FaryBooks editorial polish */
:root{--rose:#b83e68;--rose2:#d986a3;--blush:#fbf0f3;--paper:#fffaf8;--plum:#392630;--gold:#b89058}
body{color:var(--plum);background:radial-gradient(circle at 90% 4%,#f6dce8 0 7%,transparent 23%),linear-gradient(180deg,#fffaf7,#fff 55%,#fdf7fa)}
.app{position:relative}.app:before,.app:after{content:'❀';position:fixed;z-index:-1;color:#dca9bd22;font-size:110px;pointer-events:none}.app:before{right:-25px;top:125px;transform:rotate(18deg)}.app:after{left:-35px;bottom:85px;transform:rotate(-20deg)}
.topbar .brand,.brand,.hero h1{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.02em}
.topbar .brand{font-weight:500}.topbar>span{color:#4a303a}.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar,.infoTabs::-webkit-scrollbar{display:none}
.pill{background:#fffafc;border-color:#ead9e0;box-shadow:inset 0 0 0 1px #fff}.pill.active{background:linear-gradient(135deg,#ad315d,#cc4c77);box-shadow:0 6px 16px #b83e6828}
.wideNew,.primary{background:linear-gradient(135deg,#ad315d,#cb4a76);box-shadow:0 8px 20px #b83e6825}
.book{border:1px solid #f2e7eb;background:#fffdfd}.cover{background:radial-gradient(circle at 75% 22%,#f2a6c2 0 3%,transparent 24%),linear-gradient(155deg,#452342 0%,#8d315f 43%,#d7608a 72%,#efb0bf 100%)}.cover:before{content:'✦';position:absolute;left:16px;top:14px;color:#ffe8ef99;font-size:19px}.meta b{font-size:16px;line-height:1.15}.progress{background:#f1e3e8}.progress i{background:linear-gradient(90deg,#b63261,#dc7899)}
.hero{border:1px solid #efdce4;background:radial-gradient(circle at 82% 18%,#f4b5ca 0 3%,transparent 23%),linear-gradient(145deg,#492547,#87305c 42%,#ce547f 73%,#efb3c2)}.hero:before{content:'FARYBOOKS';position:absolute;left:28px;top:24px;font:11px Arial,sans-serif;letter-spacing:.22em;color:#ffeaf1aa}.hero:after{content:'✦  ❦';color:#ffeaf0aa;font-size:24px}.hero h1{text-shadow:0 3px 15px #4d193b66}
.infoTabs button{border:1px solid #f0e2e7;background:#fff8fa;color:#51323e}.infoTabs button:first-child{background:linear-gradient(135deg,#ad315d,#c94a75);color:#fff;border-color:transparent}
.section,.stat,.tool{background:linear-gradient(145deg,#fff,#fffafb);border:1px solid #f2e5ea;box-shadow:0 9px 25px #77475d0c}.section h3{color:#8f3657}.stat b{color:#8e3155}.tool{color:#3f2a33;position:relative}.tool:after{content:'›';position:absolute;right:15px;color:#b56a84;font-size:20px}.tool:hover{background:#fff5f8}
.text{border:1px solid #f1e4e9;background:linear-gradient(180deg,#fff,#fffbfc);box-shadow:inset 0 1px 0 #fff}.editorbar button{color:#66394b;background:#fffafb}

/* Functional writing-workspace layer */
.quick{display:flex;gap:8px;padding:0 24px 16px}.quick button{flex:1;border:1px solid #f0e2e7;background:#fff;border-radius:14px;padding:11px;color:#593746}
.sheet{position:fixed;inset:0;background:#2f1f2866;z-index:20;display:none;align-items:end}.sheet.show{display:flex}.sheetCard{width:min(720px,100%);margin:auto;background:#fffafc;border-radius:28px 28px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}.sheetCard h2{margin:0 0 15px}.sheetCard input,.sheetCard textarea,.sheetCard select{width:100%;padding:13px;margin:6px 0;border:1px solid #eadce1;border-radius:13px;background:white}.sheetCard textarea{min-height:110px}.listItem{padding:15px 4px;border-bottom:1px solid #f0e5e9}.listItem b{display:block;margin-bottom:4px}.empty{text-align:center;padding:35px 10px;color:var(--muted)}
.focus .head,.focus .editorbar,.focus .bottom{display:none}.focus .editor{padding-top:24px}.focus .text{min-height:78vh}
</style></head><body><main class='app'>
<section id='library' class='view active'><div class='topbar'><span style='font-size:23px'>☰</span><div class='brand'>Mis Novelas</div><span style='font-size:24px;color:var(--gold)'>♕</span></div><div class='tabs'><div class='pill active'>Todas</div><div class='pill'>En progreso</div><div class='pill'>Completadas</div></div><button class='primary wideNew' onclick='openNew()'>＋ Nueva novela</button><div id='books' class='grid'></div></section>
<section id='novel' class='view'><div class='head'><button class='back' onclick="show('library')">‹</button><b>Mi novela</b><span></span></div><div id='hero' class='hero'><h1 id='novelTitle'></h1></div><div class='infoTabs'><button>Información</button><button onclick='renderChapters()'>Capítulos</button><button onclick='renderCharacters()'>Personajes</button><button onclick="openWorkspace('world')">Mundo</button></div><div class='section'><h3>SINOPSIS</h3><p id='synopsis'></p></div><div class='stats'><div class='stat'><b id='statCh'>0</b>Capítulos</div><div class='stat'><b>—</b>Páginas</div><div class='stat'><b id='statWords'>0</b>Palabras</div><div class='stat'><b>✦</b>En progreso</div></div><div class='tools'><button class='tool' onclick='renderCharacters()'>♙ &nbsp;Personajes</button><button class='tool' onclick="openWorkspace('notes')">▤ &nbsp;Notas</button><button class='tool' onclick="openWorkspace('world')">◎ &nbsp;Mundo / Lore</button><button class='tool' onclick="openWorkspace('ideas')">✧ &nbsp;Ideas</button><button class='tool' onclick="openWorkspace('timeline')">◫ &nbsp;Línea temporal</button><button class='tool' onclick="openWorkspace('scenes')">▣ &nbsp;Escenas</button></div><div class='section' id='chapters' style='display:none'></div><div class='section' id='characters' style='display:none'></div></section>
<section id='editor' class='view'><div class='head'><button class='back' onclick="show('novel')">‹</button><b>Editor</b><span>☁︎</span></div><div class='editor'><input id='chapterTitle' class='title' placeholder='Título del capítulo'><div class='editorbar'><button onclick="document.execCommand('undo')">↶</button><button onclick="document.execCommand('redo')">↷</button><button onclick="formatText('bold')"><b>B</b></button><button onclick="formatText('italic')"><i>I</i></button><button onclick="formatText('underline')"><u>U</u></button><button onclick="insertList()">☷</button><button onclick="toggleFocus()">◉ Foco</button></div><div id='chapterText' class='text' contenteditable='true' data-placeholder='Empieza a escribir tu historia...'></div><div id='status' class='status'>Guardado automáticamente · 0 palabras</div></div></section>
<nav class='bottom'><span onclick="show('library')">▥ Biblioteca</span><span onclick="openWorkspace('notes')">▤ Notas</span><span onclick="openWorkspace('ideas')">✧ Ideas</span><span onclick="openSettings()">⚙ Ajustes</span></nav></main>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheetCard"><div id="sheetContent"></div></div></div><div id='modal' class='modal'><div class='box'><h2>Nueva novela</h2><input id='newTitle' placeholder='Título'><textarea id='newSynopsis' placeholder='Sinopsis'></textarea><div class='row'><button class='pill' onclick='closeNew()'>Cancelar</button><button class='primary' onclick='createNovel()'>Crear novela</button></div></div></div>
<script>
const KEY='farybooks-v01';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{books:[{id:1,title:'Reclamada por el Rey Lycan',synopsis:'Una historia de secretos, poder y destino.',chapters:[{title:'El inicio de todo',text:''}]}]};let currentBook=1,currentChapter=0;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='library')renderBooks()}function renderBooks(){let el=document.getElementById('books');el.innerHTML=data.books.map(b=>`<article class="book" onclick="openBook(${b.id})"><div class="cover">${b.title}</div><div class="meta"><b>${b.title}</b><br><small>${b.chapters.length} capítulos</small><div class="progress"><i></i></div></div></article>`).join('')+`<article class="book new" onclick="openNew()"><div><div style="font-size:42px;text-align:center">＋</div>Nueva novela</div></article>`}function openNew(){modal.classList.add('show')}function closeNew(){modal.classList.remove('show')}function createNovel(){let t=newTitle.value.trim();if(!t)return;let id=Date.now();data.books.push({id,title:t,synopsis:newSynopsis.value.trim()||'Sin sinopsis todavía.',chapters:[]});save();newTitle.value='';newSynopsis.value='';closeNew();renderBooks()}function openBook(id){currentBook=id;let b=data.books.find(x=>x.id===id);novelTitle.textContent=b.title;synopsis.textContent=b.synopsis;chapters.innerHTML='';statCh.textContent=b.chapters.length;statWords.textContent=b.chapters.reduce((n,c)=>n+words(c.text),0).toLocaleString('es-MX');show('novel')}function renderChapters(){characters.style.display='none';chapters.style.display='block';let b=data.books.find(x=>x.id===currentBook);chapters.innerHTML='<h3>Capítulos</h3>'+b.chapters.map((c,i)=>`<div class="chapter" onclick="openChapter(${i})"><b>${i+1}. ${c.title||'Sin título'}</b><br><small>${words(c.text)} palabras</small></div>`).join('')+`<button class="primary" style="width:100%;margin-top:14px" onclick="addChapter()">+ Nuevo capítulo</button>`}function renderCharacters(){chapters.style.display='none';characters.style.display='block';let b=data.books.find(x=>x.id===currentBook);b.characters=b.characters||[];characters.innerHTML='<h3>Personajes</h3>'+b.characters.map((p,i)=>`<div class="chapter"><b>${p.name}</b><br><small>${p.role||'Sin rol'} · ${p.notes||'Sin notas'}</small><div style="margin-top:8px"><button class="pill" onclick="editCharacter(${i})">Editar</button> <button class="pill" onclick="deleteCharacter(${i})">Eliminar</button></div></div>`).join('')+`<button class="primary" style="width:100%;margin-top:14px" onclick="addCharacter()">+ Nuevo personaje</button>`;save()}function addCharacter(){let name=prompt('Nombre del personaje');if(!name)return;let role=prompt('Rol (protagonista, antagonista, secundario...)')||'';let notes=prompt('Descripción o notas')||'';let b=data.books.find(x=>x.id===currentBook);b.characters=b.characters||[];b.characters.push({name,role,notes});save();renderCharacters()}function editCharacter(i){let b=data.books.find(x=>x.id===currentBook),p=b.characters[i];let name=prompt('Nombre',p.name);if(name===null)return;p.name=name.trim()||p.name;let role=prompt('Rol',p.role||'');if(role!==null)p.role=role;let notes=prompt('Descripción o notas',p.notes||'');if(notes!==null)p.notes=notes;save();renderCharacters()}function deleteCharacter(i){if(!confirm('¿Eliminar este personaje?'))return;let b=data.books.find(x=>x.id===currentBook);b.characters.splice(i,1);save();renderCharacters()}function addChapter(){let b=data.books.find(x=>x.id===currentBook);b.chapters.push({title:'Nuevo capítulo',text:''});save();renderChapters()}function openChapter(i){currentChapter=i;let c=data.books.find(x=>x.id===currentBook).chapters[i];chapterTitle.value=c.title;chapterText.innerHTML=c.text||'';updateStatus();show('editor')}function plainText(v){let d=document.createElement('div');d.innerHTML=v||'';return d.innerText||d.textContent||''}function words(s){return (plainText(s).trim().match(/\\S+/g)||[]).length}function updateStatus(){status.textContent=`Guardado automáticamente · ${words(chapterText.innerHTML)} palabras`}function editSave(){let c=data.books.find(x=>x.id===currentBook).chapters[currentChapter];c.title=chapterTitle.value;c.text=chapterText.innerHTML;save();updateStatus()}chapterTitle.addEventListener('input',editSave);chapterText.addEventListener('input',editSave);
function book(){return data.books.find(x=>x.id===currentBook)}
function closeSheet(){sheet.classList.remove('show')}
function openWorkspace(type){let b=book()||data.books[0];b[type]=b[type]||[];let names={notes:'Notas',ideas:'Ideas',world:'Mundo / Lore',timeline:'Línea temporal',scenes:'Escenas'};sheetContent.innerHTML='<h2>'+names[type]+'</h2><div id="workspaceList"></div><button class="primary" style="width:100%;margin-top:15px" onclick="addWorkspace(\''+type+'\')">＋ Agregar</button>';workspaceList.innerHTML=b[type].length?b[type].map((x,i)=>'<div class="listItem"><b>'+esc(x.title)+'</b><div>'+esc(x.text)+'</div><button class="pill" style="margin-top:8px" onclick="removeWorkspace(\''+type+'\','+i+')">Eliminar</button></div>').join(''):'<div class="empty">Todavía no hay contenido.</div>';sheet.classList.add('show');save()}
function addWorkspace(type){let title=prompt('Título');if(!title)return;let text=prompt('Contenido / descripción')||'';book()[type].push({title,text});save();openWorkspace(type)}
function removeWorkspace(type,i){if(confirm('¿Eliminar?')){book()[type].splice(i,1);save();openWorkspace(type)}}
function openSettings(){sheetContent.innerHTML='<h2>Ajustes</h2><div class="listItem"><b>Experiencia de escritura</b>Guardado automático activado.</div><div class="listItem"><b>Modo enfoque</b>Disponible dentro del editor para escribir sin distracciones.</div><button class="primary" style="width:100%;margin-top:15px" onclick="closeSheet()">Listo</button>';sheet.classList.add('show')}
function esc(v){return String(v||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function wrapSelection(a,b){let e=chapterText,start=e.selectionStart,end=e.selectionEnd,v=e.value;e.value=v.slice(0,start)+a+v.slice(start,end)+b+v.slice(end);e.focus();e.selectionStart=start+a.length;e.selectionEnd=end+a.length;editSave()}
function insertList(){let e=chapterText,start=e.selectionStart;e.value=e.value.slice(0,start)+'\n• '+e.value.slice(start);e.focus();e.selectionStart=e.selectionEnd=start+3;editSave()}
function toggleFocus(){document.querySelector('.app').classList.toggle('focus')}
renderBooks();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
