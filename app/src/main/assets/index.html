<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheetCard"><div id="sheetContent"></div></div></div><div id='modal' class='modal'><div class='box'><h2>Nueva novela</h2><input id='newTitle' placeholder='Título'><textarea id='newSynopsis' placeholder='Sinopsis'></textarea><div class='row'><button class='pill' onclick='closeNew()'>Cancelar</button><button class='primary' onclick='createNovel()'>Crear novela</button></div></div></div>
<script>
const KEY='farybooks-v01';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{books:[]};let currentBook=1,currentChapter=0;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='library')renderBooks()}let libraryFilter='all';function filterBooks(filter,el){libraryFilter=filter;document.querySelectorAll('#libraryTabs .pill').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderBooks()}function renderBooks(){let el=document.getElementById('books'),list=data.books.filter(b=>libraryFilter==='all'||(b.status||'progress')===libraryFilter);let cards=list.map(b=>`<article class="book" onclick="openBook(${b.id})"><div class="cover" ${b.cover?`style="background-image:url('${b.cover}');background-size:cover;background-position:center;color:white;text-shadow:0 2px 8px #0008"`:''}><button class="bookMenu" onclick="event.stopPropagation();openBookMenu(${b.id})">⋮</button>${b.cover?'':b.title}</div><div class="meta"><b>${b.title}</b><br><small>${b.chapters.length} capítulos · ${(b.status||'progress')==='completed'?'Terminada':(b.status==='paused'?'En pausa':'En progreso')}</small><div class="progress"><i></i></div></div></article>`).join('');if(data.books.length){el.innerHTML=cards+`<article class="book new" onclick="openNew()"><div><div style="font-size:42px;text-align:center">＋</div>Nueva novela</div></article>`;if(!list.length)el.innerHTML='<div class="emptyFilter">Todavía no tienes novelas en esta categoría.</div>';return}if(libraryFilter!=='all'){el.innerHTML='<div class="emptyFilter">Todavía no tienes novelas en esta categoría.</div>';return}el.innerHTML='<div class="onboarding"><h2>Bienvenida a FaryBooks</h2><p>Tu espacio para escribir, construir mundos y organizar tus historias.</p><div class="startGrid"><button class="startCard" onclick="openQuickGuide()"><b>✦ Guía rápida</b><span>Conoce las herramientas principales de FaryBooks.</span></button><button class="startCard" onclick="createDemoProject()"><b>▣ Proyecto de ejemplo</b><span>Explora una novela ficticia ya organizada.</span></button><button class="startCard" onclick="openWritingTips()"><b>❀ Consejos para comenzar</b><span>Ideas breves para planificar tu historia.</span></button></div></div>'}function openBookMenu(id){let b=data.books.find(x=>x.id===id);if(!b)return;sheetContent.innerHTML='<h2>'+esc(b.title)+'</h2><button class="startCard" style="width:100%" onclick="currentBook='+id+';closeSheet();openBook('+id+')"><b>✎ Abrir / editar</b><span>Entra al proyecto y modifica su información.</span></button><button class="startCard dangerBtn" style="width:100%;margin-top:10px" onclick="confirmTrashBook('+id+')"><b>♲ Mover a la papelera</b><span>Podrás recuperarla después.</span></button>';sheet.classList.add('show')}function confirmTrashBook(id){let b=data.books.find(x=>x.id===id);if(!b)return;sheetContent.innerHTML='<h2>¿Eliminar novela?</h2><p>¿Estás segura de que quieres mover <b>'+esc(b.title)+'</b> a la papelera?</p><p style="color:#806b74">No se borrará definitivamente y podrás recuperarla desde Ajustes → Papelera.</p><div class="formActions"><button class="pill" onclick="openBookMenu('+id+')">Cancelar</button><button class="primary" onclick="trashBook('+id+')">Mover a papelera</button></div>'}function trashBook(id){data.trash=data.trash||[];let i=data.books.findIndex(x=>x.id===id);if(i<0)return;let b=data.books.splice(i,1)[0];b.deletedAt=Date.now();data.trash.unshift(b);save();closeSheet();renderBooks()}function openTrash(){data.trash=data.trash||[];sheetContent.innerHTML='<h2>Papelera</h2>'+(data.trash.length?data.trash.map((b,i)=>'<div class="trashItem"><b>'+esc(b.title)+'</b><small style="display:block;color:#8b7480;margin-top:4px">Novela eliminada</small><div class="trashActions"><button class="pill" onclick="restoreBook('+i+')">↶ Recuperar</button><button class="pill dangerBtn" onclick="confirmPermanentDelete('+i+')">Eliminar definitivamente</button></div></div>').join(''):'<div class="empty">La papelera está vacía.</div>')+'<button class="pill" style="width:100%;margin-top:15px" onclick="openSettings()">‹ Volver a Ajustes</button>';sheet.classList.add('show')}function restoreBook(i){data.trash=data.trash||[];let b=data.trash.splice(i,1)[0];if(!b)return;delete b.deletedAt;data.books.push(b);save();openTrash();renderBooks()}function confirmPermanentDelete(i){let b=(data.trash||[])[i];if(!b)return;sheetContent.innerHTML='<h2>Eliminar definitivamente</h2><p><b>'+esc(b.title)+'</b> se borrará para siempre junto con sus capítulos, personajes y demás información.</p><p><b>Esta acción no se puede deshacer.</b></p><div class="formActions"><button class="pill" onclick="openTrash()">Cancelar</button><button class="primary" onclick="permanentDelete('+i+')">Eliminar definitivamente</button></div>'}function permanentDelete(i){data.trash.splice(i,1);save();openTrash()}
function openQuickGuide(){sheetContent.innerHTML='<h2>Guía rápida</h2><div class="listItem"><b>1. Crea tu novela</b>Usa + Nueva novela y añade título, sinopsis y portada.</div><div class="listItem"><b>2. Escribe capítulos</b>Organiza tu manuscrito y consulta el recuento de palabras.</div><div class="listItem"><b>3. Construye tu historia</b>Crea personajes, mundo, notas, ideas, escenas y línea temporal.</div><button class="primary" style="width:100%;margin-top:15px" onclick="closeSheet()">Entendido</button>';sheet.classList.add('show')}function openWritingTips(){sheetContent.innerHTML='<h2>Consejos para comenzar</h2><div class="listItem"><b>Empieza por el conflicto</b>Resume en una frase qué quiere tu protagonista y qué se lo impide.</div><div class="listItem"><b>Conoce a tus personajes</b>Define deseo, miedo, pasado y relaciones antes de llenar detalles menores.</div><div class="listItem"><b>Construye solo lo necesario</b>Agrega al Mundo / Lore aquello que afecte realmente la historia.</div><button class="primary" style="width:100%;margin-top:15px" onclick="closeSheet()">Listo</button>';sheet.classList.add('show')}function createDemoProject(){let id=Date.now();data.books.push({id,title:'Proyecto de ejemplo',synopsis:'Esta novela ficticia te permite explorar cómo se organizan las herramientas de FaryBooks. Puedes editarla, experimentar con ella o eliminarla cuando quieras.',status:'progress',chapters:[{title:'Capítulo de muestra',text:'Este es un espacio de ejemplo para descubrir el editor de FaryBooks.'}],characters:[{name:'Personaje de ejemplo',role:'Protagonista',personality:'Una ficha sencilla para mostrar cómo puedes organizar tus personajes.'}],world:[{category:'General',title:'Mundo de ejemplo',subtitle:'Fantasía',text:'Explora las categorías de Mundo / Lore y reemplaza este contenido con tus propias ideas.'}]});save();renderBooks();openBook(id)}
function openNew(){modal.classList.add('show')}function closeNew(){modal.classList.remove('show')}function createNovel(){let t=newTitle.value.trim();if(!t)return;let id=Date.now();data.books.push({id,title:t,synopsis:newSynopsis.value.trim()||'Sin sinopsis todavía.',status:'progress',chapters:[]});save();newTitle.value='';newSynopsis.value='';closeNew();renderBooks()}function refreshBookInfo(){let b=book();novelTitle.textContent=b.title;synopsis.textContent=b.synopsis||'Sin sinopsis todavía.';synopsis.className='synopsisCollapsed';let st=document.getElementById('synopsisToggle');if(st)st.textContent='Leer más⌄';statCh.textContent=b.chapters.length;statWords.textContent=b.chapters.reduce((n,c)=>n+words(c.text),0).toLocaleString('es-MX');let bookStatus=b.status||'progress',labels={progress:'En progreso',paused:'En pausa',completed:'Terminada'},icons={progress:'✦',paused:'Ⅱ',completed:'✓'};let statusEl=document.getElementById('statStatus'),statusIconEl=document.getElementById('statStatusIcon');if(statusEl)statusEl.textContent=labels[bookStatus];if(statusIconEl)statusIconEl.textContent=icons[bookStatus];hero.classList.toggle('hasCover',!!b.cover);hero.style.backgroundImage=b.cover?'url("'+b.cover+'")':''}function openBook(id){currentBook=id;let b=book();chapters.innerHTML='';refreshBookInfo();show('novel');activateNovelTab('info')}function activateNovelTab(name){document.querySelectorAll('.infoTabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));let info=document.getElementById('novelInfo');if(info)info.style.display=name==='info'?'block':'none';chapters.style.display=name==='chapters'?'block':'none';characters.style.display=name==='characters'?'block':'none'}function showNovelTab(name,el){activateNovelTab(name);if(name==='chapters'){renderChapters();return}if(name==='characters'){renderCharacters();return}if(name==='world'){openWorld();return}}function openWorld(cat='General'){activateNovelTab('world');let b=book();b.world=b.world||[];let cats=['General','Lugares','Países / Reinos','Razas','Poderes','Gobierno','Religión','Historia','Reglas'];let items=b.world.filter(x=>(x.category||'General')===cat);sheetContent.innerHTML='<h2>Mundo / Lore</h2><div class="worldTabs">'+cats.map(c=>'<button class="pill '+(c===cat?'active':'')+'" onclick="openWorld(\''+c+'\')">'+c+'</button>').join('')+'</div>'+(items.length?items.map((x,i)=>'<div class="worldCard"><b>'+esc(x.title)+'</b><small>'+esc(x.subtitle||'')+'</small><div>'+esc(x.text||'')+'</div><button class="pill" style="margin-top:8px" onclick="worldForm(\''+cat+'\','+b.world.indexOf(x)+')">Editar</button> <button class="pill" style="margin-top:8px" onclick="deleteWorld('+b.world.indexOf(x)+',\''+cat+'\')">Eliminar</button></div>').join(''):'<div class="empty">Todavía no hay información en '+cat+'.</div>')+'<button class="primary" style="width:100%;margin-top:15px" onclick="worldForm(\''+cat+'\')">＋ Agregar a '+cat+'</button>';sheet.classList.add('show')}function worldForm(cat,i=null){let b=book(),x=i===null?{}:b.world[i];let hints={General:'Nombre del mundo / época',Lugares:'Nombre del lugar', 'Países / Reinos':'País, reino o territorio',Razas:'Nombre de la raza',Poderes:'Nombre del poder o sistema mágico',Gobierno:'Gobierno / autoridad',Religión:'Religión, dioses o creencias',Historia:'Evento o periodo histórico',Reglas:'Regla del mundo'};sheetContent.innerHTML='<h2>'+cat+'</h2><div class="worldGrid"><input class="full" id="wfTitle" placeholder="'+hints[cat]+'" value="'+esc(x.title||'')+'"><input id="wfSubtitle" placeholder="'+(cat==='General'?'Época: medieval, moderna...':cat==='Gobierno'?'Gobernante / líder':'Región / clasificación')+'" value="'+esc(x.subtitle||'')+'"><input id="wfExtra" placeholder="'+(cat==='General'?'Tecnología / nivel social':cat==='Lugares'?'País / reino':'Dato clave')+'" value="'+esc(x.extra||'')+'"><textarea class="full" id="wfText" placeholder="Descripción, costumbres, funcionamiento, detalles importantes...">'+esc(x.text||'')+'</textarea></div><div class="formActions"><button class="pill" onclick="openWorld(\''+cat+'\')">Cancelar</button><button class="primary" onclick="saveWorld(\''+cat+'\','+(i===null?'null':i)+')">Guardar</button></div>'}function saveWorld(cat,i){let title=document.getElementById('wfTitle').value.trim();if(!title)return;let x={category:cat,title,subtitle:document.getElementById('wfSubtitle').value.trim(),extra:document.getElementById('wfExtra').value.trim(),text:document.getElementById('wfText').value.trim()};let b=book();b.world=b.world||[];if(i===null)b.world.push(x);else b.world[i]=x;save();openWorld(cat)}function deleteWorld(i,cat){let b=book();b.world.splice(i,1);save();openWorld(cat)}
function renderChapters(){activateNovelTab('chapters');characters.style.display='none';chapters.style.display='block';let b=data.books.find(x=>x.id===currentBook);chapters.innerHTML='<h3>Capítulos</h3>'+b.chapters.map((c,i)=>`<div class="chapter" onclick="openChapter(${i})"><b>${i+1}. ${c.title||'Sin título'}</b><br><small>${words(c.text)} palabras</small></div>`).join('')+`<button class="primary" style="width:100%;margin-top:14px" onclick="addChapter()">+ Nuevo capítulo</button>`}function renderCharacters(){activateNovelTab('characters');chapters.style.display='none';characters.style.display='block';let b=book();b.characters=b.characters||[];characters.innerHTML='<h3>PERSONAJES</h3>'+(b.characters.length?b.characters.map((p,i)=>`<div class="charCard"><h3>${esc(p.name)}</h3><div class="charTags"><span>${esc(p.role||'Sin rol')}</span>${p.age?'<span>'+esc(p.age)+' años</span>':''}${p.species?'<span>'+esc(p.species)+'</span>':''}</div><div class="charNotes">${esc(p.personality||p.notes||'Sin descripción')}</div><div style="margin-top:10px"><button class="pill" onclick="editCharacter(${i})">Editar ficha</button> <button class="pill" onclick="deleteCharacter(${i})">Eliminar</button></div></div>`).join(''):'<div class="empty">Crea las fichas de quienes dan vida a tu historia.</div>')+`<button class="primary" style="width:100%;margin-top:14px" onclick="characterForm()">＋ Nuevo personaje</button>`;save()}function characterForm(i=null){let b=book();b.characters=b.characters||[];let p=i===null?{}:b.characters[i];sheetContent.innerHTML=`<h2>${i===null?'Nuevo personaje':'Editar personaje'}</h2><input id="cfName" placeholder="Nombre *" value="${esc(p.name||'')}"><input id="cfRole" placeholder="Rol: protagonista, antagonista..." value="${esc(p.role||'')}"><div class="row"><input id="cfAge" placeholder="Edad" value="${esc(p.age||'')}"><input id="cfSpecies" placeholder="Raza / especie" value="${esc(p.species||'')}"></div><textarea id="cfAppearance" placeholder="Apariencia física">${esc(p.appearance||'')}</textarea><textarea id="cfPersonality" placeholder="Personalidad">${esc(p.personality||'')}</textarea><textarea id="cfHistory" placeholder="Historia / pasado">${esc(p.history||'')}</textarea><textarea id="cfRelations" placeholder="Relaciones con otros personajes">${esc(p.relations||'')}</textarea><textarea id="cfNotes" placeholder="Notas adicionales">${esc(p.notes||'')}</textarea><div class="formActions"><button class="pill" onclick="closeSheet()">Cancelar</button><button class="primary" onclick="saveCharacter(${i===null?'null':i})">Guardar ficha</button></div>`;sheet.classList.add('show')}function saveCharacter(i){let name=cfName.value.trim();if(!name){cfName.focus();return}let p={name,role:cfRole.value.trim(),age:cfAge.value.trim(),species:cfSpecies.value.trim(),appearance:cfAppearance.value.trim(),personality:cfPersonality.value.trim(),history:cfHistory.value.trim(),relations:cfRelations.value.trim(),notes:cfNotes.value.trim()};let b=book();b.characters=b.characters||[];if(i===null)b.characters.push(p);else b.characters[i]=p;save();closeSheet();renderCharacters()}function addCharacter(){characterForm()}function editCharacter(i){characterForm(i)}function deleteCharacter(i){let b=book();if(!b||!b.characters||!b.characters[i])return;sheetContent.innerHTML='<h2>Eliminar personaje</h2><p>¿Quieres eliminar a <b>'+esc(b.characters[i].name)+'</b>? Esta acción no se puede deshacer.</p><div class="formActions"><button class="pill" onclick="closeSheet()">Cancelar</button><button class="primary" onclick="confirmDeleteCharacter('+i+')">Eliminar</button></div>';sheet.classList.add('show')}function confirmDeleteCharacter(i){let b=book();b.characters.splice(i,1);save();closeSheet();renderCharacters()}function addChapter(){let b=data.books.find(x=>x.id===currentBook);b.chapters.push({title:'Nuevo capítulo',text:''});save();renderChapters()}function openChapter(i){currentChapter=i;let c=data.books.find(x=>x.id===currentBook).chapters[i];chapterTitle.value=c.title;chapterText.value=plainText(c.text||'');updateStatus();show('editor')}function plainText(v){let d=document.createElement('div');d.innerHTML=v||'';return d.innerText||d.textContent||''}function words(s){let t=plainText(String(s||'')).trim();if(!t)return 0;try{return (t.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu)||[]).length}catch(e){return (t.match(/\b[\wÁÉÍÓÚÜÑáéíóúüñ]+\b/g)||[]).length}}function updateStatus(){status.textContent=`Guardado automáticamente · ${words(chapterText.value)} palabras`}function editSave(){let c=data.books.find(x=>x.id===currentBook).chapters[currentChapter];c.title=chapterTitle.value;c.text=chapterText.value;save();updateStatus();if(document.getElementById('novel').classList.contains('active'))refreshBookInfo()}chapterTitle.addEventListener('input',editSave);chapterText.addEventListener('input',editSave);
function toggleSynopsis(){let p=document.getElementById('synopsis'),btn=document.getElementById('synopsisToggle'),expanded=p.classList.contains('synopsisExpanded');p.className=expanded?'synopsisCollapsed':'synopsisExpanded';btn.textContent=expanded?'Leer más⌄':'Toca la sinopsis para contraer⌃'}function collapseSynopsisIfOpen(){let p=document.getElementById('synopsis');if(p.classList.contains('synopsisExpanded')){p.className='synopsisCollapsed';document.getElementById('synopsisToggle').textContent='Leer más⌄';p.scrollIntoView({behavior:'smooth',block:'center'})}}
function openStatusPicker(){let b=book(),opts=[['progress','✦','En progreso'],['paused','Ⅱ','En pausa'],['completed','✓','Terminada']];sheetContent.innerHTML='<h2>Estado de la novela</h2><div class="statusChoices">'+opts.map(o=>'<button class="statusChoice '+((b.status||'progress')===o[0]?'active':'')+'" onclick="setBookStatus(\''+o[0]+'\')"><b>'+o[1]+' '+o[2]+'</b></button>').join('')+'</div>';sheet.classList.add('show')}function setBookStatus(status){book().status=status;save();refreshBookInfo();closeSheet();renderBooks()}
function bookForm(){let b=book();sheetContent.innerHTML='<div class="bookEdit"><h2>Editar novela</h2><input id="bfTitle" placeholder="Título de la novela" value="'+esc(b.title)+'"><select id="bfStatus"><option value="progress">En progreso</option><option value="paused">En pausa</option><option value="completed">Terminada</option></select><textarea id="bfSynopsis" placeholder="Escribe la sinopsis de tu novela...">'+esc(b.synopsis||'')+'</textarea><button class="pill" style="width:100%;margin:8px 0" onclick="document.getElementById(\'coverPicker\').click()">▣ Elegir portada desde el teléfono</button><div class="formActions"><button class="pill" onclick="closeSheet()">Cancelar</button><button class="primary" onclick="saveBookInfo()">Guardar cambios</button></div></div>';document.getElementById('bfStatus').value=b.status||'progress';sheet.classList.add('show')}function saveBookInfo(){let b=book(),t=document.getElementById('bfTitle').value.trim();if(!t)return;b.title=t;b.status=document.getElementById('bfStatus').value;b.synopsis=document.getElementById('bfSynopsis').value.trim();save();refreshBookInfo();closeSheet()}function applyCover(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(e){let img=new Image();img.onload=function(){let max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);book().cover=c.toDataURL('image/jpeg',.82);save();refreshBookInfo();input.value=''};img.src=e.target.result};reader.readAsDataURL(file)}
function book(){return data.books.find(x=>x.id===currentBook)}
function closeSheet(){sheet.classList.remove('show')}
function openWorkspace(type){let b=book()||data.books[0];b[type]=b[type]||[];let names={notes:'Notas',ideas:'Ideas',world:'Mundo / Lore',timeline:'Línea temporal',scenes:'Escenas'};sheetContent.innerHTML='<h2>'+names[type]+'</h2><div id="workspaceList"></div><button class="primary" style="width:100%;margin-top:15px" onclick="addWorkspace(\''+type+'\')">＋ Agregar</button>';workspaceList.innerHTML=b[type].length?b[type].map((x,i)=>'<div class="listItem"><b>'+esc(x.title)+'</b><div>'+esc(x.text)+'</div><button class="pill" style="margin-top:8px" onclick="removeWorkspace(\''+type+'\','+i+')">Eliminar</button></div>').join(''):'<div class="empty">Todavía no hay contenido.</div>';sheet.classList.add('show');save()}
function addWorkspace(type){let title=prompt('Título');if(!title)return;let text=prompt('Contenido / descripción')||'';book()[type].push({title,text});save();openWorkspace(type)}
function removeWorkspace(type,i){if(confirm('¿Eliminar?')){book()[type].splice(i,1);save();openWorkspace(type)}}
let aiChats=JSON.parse(localStorage.getItem('faryai-chats')||'[]'),activeAIChat=null;
function saveAIChats(){localStorage.setItem('faryai-chats',JSON.stringify(aiChats))}
function openFaryAI(){closeSheet();renderAIHome()}
function renderAIHome(){let old=document.getElementById('aiPage');if(old)old.remove();let p=document.createElement('div');p.id='aiPage';p.className='aiPage';let cards=aiChats.length?aiChats.map((c,i)=>'<button class="aiSavedCard" onclick="openAIChat('+i+')"><b>'+esc(c.title||'Nuevo chat')+'</b><span>'+esc((c.messages[c.messages.length-1]||{}).text||'Continuar conversación')+'</span></button>').join(''):'<div class="aiEmpty"><div style="font-size:42px">✦</div><h2>FaryAI</h2><p>Tus conversaciones aparecerán aquí. Puedes guardar hasta 3 chats para continuarlos cuando quieras.</p></div>';p.innerHTML='<div class="aiTop"><button class="aiBack" onclick="closeAIPage()">‹</button><h1>FaryAI</h1><button class="aiMore" onclick="showAIManage()">•••</button></div><div class="aiSaved">'+cards+'</div><button class="aiFab" onclick="newAIChat()">＋</button>';document.body.appendChild(p)}
function closeAIPage(){let p=document.getElementById('aiPage');if(p)p.remove();activeAIChat=null}
function newAIChat(){if(aiChats.length>=3){alert('Puedes guardar hasta 3 chats. Borra uno para crear una conversación nueva.');return}aiChats.unshift({title:'Nuevo chat',createdAt:Date.now(),messages:[]});saveAIChats();openAIChat(0)}
function openAIChat(i){activeAIChat=i;let c=aiChats[i];if(!c)return renderAIHome();let p=document.getElementById('aiPage');if(!p){renderAIHome();p=document.getElementById('aiPage')}let msgs=c.messages.length?c.messages.map(m=>'<div class="aiBubble '+(m.role==='user'?'user':'ai')+'">'+esc(m.text)+'</div>').join(''):'<div class="aiBubble ai">Hola ✦ ¿En qué trabajamos hoy? Pídeme ayuda con una escena, personaje, idea o pega un fragmento para revisarlo.</div>';p.innerHTML='<div class="aiTop"><button class="aiBack" onclick="renderAIHome()">‹</button><h1>'+esc(c.title)+'</h1><button class="aiMore" onclick="deleteAIChat('+i+')">⋮</button></div><div class="aiConversation"><div id="aiChat" class="aiChat">'+msgs+'</div><div class="aiComposer"><textarea id="aiInput" placeholder="Escribe a FaryAI..."></textarea><button id="aiSend" class="primary" onclick="sendFaryAI()">Enviar</button></div></div>';setTimeout(()=>{let ch=document.getElementById('aiChat');if(ch)window.scrollTo(0,document.body.scrollHeight)},50)}
function deleteAIChat(i){if(confirm('¿Borrar este chat? Esta conversación se eliminará definitivamente.')){aiChats.splice(i,1);saveAIChats();activeAIChat=null;renderAIHome()}}
function showAIManage(){if(!aiChats.length){alert('Todavía no tienes chats guardados.');return}let names=aiChats.map((c,i)=>(i+1)+'. '+c.title).join('\n');let n=prompt('Chats guardados:\n'+names+'\n\nEscribe el número del chat que quieres borrar:');let i=parseInt(n)-1;if(i>=0&&i<aiChats.length)deleteAIChat(i)}
function sendFaryAI(){let input=document.getElementById('aiInput'),msg=input&&input.value.trim();if(!msg||activeAIChat===null)return;let c=aiChats[activeAIChat];c.messages.push({role:'user',text:msg});if(c.title==='Nuevo chat')c.title=msg.length>34?msg.slice(0,34)+'…':msg;saveAIChats();let chat=document.getElementById('aiChat');let u=document.createElement('div');u.className='aiBubble user';u.textContent=msg;chat.appendChild(u);let t=document.createElement('div');t.id='aiThinking';t.className='aiBubble ai aiThinking';t.textContent='FaryAI está escribiendo…';chat.appendChild(t);input.value='';document.getElementById('aiSend').disabled=true;window.scrollTo(0,document.body.scrollHeight);let context=c.messages.slice(-10).map(m=>(m.role==='user'?'Autora: ':'FaryAI: ')+m.text).join('\n');if(window.FaryNative&&FaryNative.ask)FaryNative.ask(context);else receiveFaryAI('FaryAI necesita ejecutarse dentro de la aplicación Android.',true)}
function receiveFaryAI(msg,error){let t=document.getElementById('aiThinking');if(t)t.remove();let chat=document.getElementById('aiChat');if(chat){let d=document.createElement('div');d.className='aiBubble ai'+(error?' error':'');d.textContent=msg;chat.appendChild(d)}if(!error&&activeAIChat!==null&&aiChats[activeAIChat]){aiChats[activeAIChat].messages.push({role:'assistant',text:msg});saveAIChats()}let send=document.getElementById('aiSend');if(send)send.disabled=false;window.scrollTo(0,document.body.scrollHeight)}window.receiveFaryAI=receiveFaryAI;
function openSettings(){sheetContent.innerHTML='<h2>Ajustes</h2><div class="listItem"><b>Experiencia de escritura</b>Guardado automático activado.</div><div class="listItem"><b>Modo enfoque</b>Disponible dentro del editor para escribir sin distracciones.</div><button class="startCard" style="width:100%;margin-top:10px" onclick="openTrash()"><b>♲ Papelera</b><span>Recupera novelas eliminadas o bórralas definitivamente.</span></button><button class="primary" style="width:100%;margin-top:15px" onclick="closeSheet()">Listo</button>';sheet.classList.add('show')}
function esc(v){return String(v||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
let fmt={bold:false,italic:false,underline:false};function toggleFmt(k){fmt[k]=!fmt[k];document.getElementById(k+'Btn').classList.toggle('active',fmt[k]);chapterText.focus()}function stylize(t){let out=t;if(fmt.bold)out=toBold(out);if(fmt.italic)out=toItalic(out);if(fmt.underline)out=[...out].map(c=>c===' '?c:c+'̲').join('');return out}function toBold(t){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',b=[...'𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇'];return [...t].map(c=>a.includes(c)?b[a.indexOf(c)]:c).join('')}function toItalic(t){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',b=[...'𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻'];return [...t].map(c=>a.includes(c)?b[a.indexOf(c)]:c).join('')}chapterText.addEventListener('beforeinput',e=>{if(e.inputType==='insertText'&&e.data&&(fmt.bold||fmt.italic||fmt.underline)){e.preventDefault();let a=chapterText.selectionStart,b=chapterText.selectionEnd,v=stylize(e.data);chapterText.setRangeText(v,a,b,'end');editSave()}});function insertList(){let e=chapterText,start=e.selectionStart;e.setRangeText('\n• ',start,start,'end');e.focus();editSave()}
function toggleFocus(){document.querySelector('.app').classList.toggle('focus');document.querySelector('.focusBtn').textContent=document.querySelector('.app').classList.contains('focus')?'✕ Salir de foco':'◉ Foco'}
function handleAndroidBack(){let app=document.querySelector('.app');if(app.classList.contains('focus')){toggleFocus();return true}if(sheet.classList.contains('show')){closeSheet();return true}if(modal.classList.contains('show')){closeNew();return true}if(document.getElementById('editor').classList.contains('active')){show('novel');return true}if(document.getElementById('novel').classList.contains('active')){show('library');return true}return false}
renderBooks();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
